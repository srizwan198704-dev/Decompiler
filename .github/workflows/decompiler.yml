name: Decompile from URL
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Google Drive Link or Any APK URL'
        required: true

jobs:
  decompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Download APK
        run: |
          pip install gdown
          URL="${{ github.event.inputs.apk_url }}"
          
          if [[ "$URL" == *"drive.google.com"* ]]; then
            # গুগল ড্রাইভ লিঙ্ক থেকে আইডি বের করে ডাউনলোড করা
            gdown "$URL" -O input_app.apk --remaining-ok
          else
            # সরাসরি লিঙ্ক হলে curl ব্যবহার করা
            curl -L "$URL" -o input_app.apk
          fi

      - name: Check File
        run: |
          ls -lh input_app.apk
          file input_app.apk

      - name: Setup Java & APKTool
        run: |
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Decompile
        run: |
          # যদি আগে ডিকম্পাইল করা ফোল্ডার থাকে তবে তা মুছে ফেলা
          rm -rf decompiled_app
          apktool d input_app.apk -o decompiled_app

      - name: Commit Decompiled Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add decompiled_app/
          git commit -m "Decompiled APK from URL" || echo "No changes to commit"
          git push
