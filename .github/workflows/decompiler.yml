name: Decompile from URL
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Google Drive Link or Any APK URL'
        required: true

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Download APK
        run: |
          pip install gdown
          # গুগল ড্রাইভ লিঙ্ক হলে gdown ব্যবহার করবে, অন্যথায় curl
          if [[ "${{ github.event.inputs.apk_url }}" == *"drive.google.com"* ]]; then
            gdown --fuzzy "${{ github.event.inputs.apk_url }}" -O input_app.apk
          else
            curl -L "${{ github.event.inputs.apk_url }}" -o input_app.apk
          fi

      - name: Check File Size
        run: ls -lh input_app.apk

      - name: Setup Java & APKTool
        run: |
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Decompile
        run: |
          apktool d input_app.apk -o decompiled_app

      - name: Commit Decompiled Files
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add decompiled_app/
          git commit -m "Decompiled from URL"
          git push
