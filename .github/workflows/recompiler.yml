name: Full Package Rename to com.whatsapp.w4b

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java & APKTool
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless
          
          # Download APKTool
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          
          apktool --version

      - name: Detect Old Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Get package from AndroidManifest
          OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          
          # If not found, try to find from smali directories
          if [ -z "$OLD_PACKAGE" ]; then
            OLD_PACKAGE=$(find "$DECOMPILED_DIR/smali" -type d -name "com" -exec find {} -type d -name "whatsapp" \; | head -1 | sed 's|'$DECOMPILED_DIR'/smali/||' | tr '/' '.' | cut -d'.' -f1-3)
          fi
          
          # Extract the base package
          BASE_PACKAGE=$(echo "$OLD_PACKAGE" | cut -d'.' -f1-3)
          
          echo "OLD_PACKAGE=$OLD_PACKAGE" >> $GITHUB_ENV
          echo "BASE_PACKAGE=$BASE_PACKAGE" >> $GITHUB_ENV
          echo "NEW_PACKAGE=com.whatsapp.w4b" >> $GITHUB_ENV
          
          echo "Detected Old Package: $OLD_PACKAGE"
          echo "Base Package: $BASE_PACKAGE"
          echo "New Package: com.whatsapp.w4b"

      - name: Update AndroidManifest.xml
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update main package
          sed -i "s/package=\"$OLD_PACKAGE\"/package=\"com.whatsapp.w4b\"/" "$DECOMPILED_DIR/AndroidManifest.xml"
          
          # Update all package references in manifest
          sed -i "s/$OLD_PACKAGE/com.whatsapp.w4b/g" "$DECOMPILED_DIR/AndroidManifest.xml"
          
          echo "✓ AndroidManifest.xml updated"

      - name: Rename All Directory Structures
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Convert package names to path format
          OLD_PATH=$(echo "$OLD_PACKAGE" | tr '.' '/')
          BASE_PATH=$(echo "$BASE_PACKAGE" | tr '.' '/')
          NEW_PATH="com/whatsapp/w4b"
          
          echo "Old path: $OLD_PATH"
          echo "Base path: $BASE_PATH"
          echo "New path: $NEW_PATH"
          
          # Find and rename directories in all smali folders
          find "$DECOMPILED_DIR" -type d -name "smali*" | while read smali_dir; do
            if [ -d "$smali_dir" ]; then
              cd "$smali_dir"
              
              # Rename full package path
              if [ -d "$OLD_PATH" ]; then
                mkdir -p "$(dirname "$NEW_PATH")"
                mv "$OLD_PATH" "$NEW_PATH" 2>/dev/null || true
                echo "  ✓ Renamed in $(basename $smali_dir)"
              fi
              
              cd - > /dev/null
            fi
          done

      - name: Update All Smali Files Content
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update all smali files
          find "$DECOMPILED_DIR" -type f -name "*.smali" | while read file; do
            # Replace package references
            sed -i "s|L$OLD_PACKAGE/|Lcom/whatsapp/w4b/|g" "$file"
            sed -i "s|L$BASE_PACKAGE/|Lcom/whatsapp/w4b/|g" "$file"
            sed -i "s|$OLD_PACKAGE|com.whatsapp.w4b|g" "$file"
            sed -i "s|$BASE_PACKAGE|com.whatsapp.w4b|g" "$file"
          done
          
          echo "✓ Updated all smali files"

      - name: Update All XML Files
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update all XML files
          find "$DECOMPILED_DIR" -type f -name "*.xml" | while read file; do
            sed -i "s|$OLD_PACKAGE|com.whatsapp.w4b|g" "$file"
            sed -i "s|$BASE_PACKAGE|com.whatsapp.w4b|g" "$file"
          done
          
          echo "✓ Updated all XML files"

      - name: Update JSON and Other Files
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update JSON files
          find "$DECOMPILED_DIR" -type f \( -name "*.json" -o -name "*.properties" \) | while read file; do
            sed -i "s|$OLD_PACKAGE|com.whatsapp.w4b|g" "$file" 2>/dev/null || true
          done
          
          echo "✓ Updated JSON files"

      - name: Recompile APK
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          echo "=== Recompiling APK ==="
          apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk
          
          if [ ! -f "recompiled_unsigned.apk" ] || [ ! -s "recompiled_unsigned.apk" ]; then
            echo "❌ Recompilation failed!"
            exit 1
          fi
          
          echo "✅ Recompilation successful!"
          ls -lh recompiled_unsigned.apk

      - name: Generate Keystore and Sign APK (Modern Algorithm)
        run: |
          # Create keystore with modern algorithm
          keytool -genkey -v \
            -keystore w4b-keystore.jks \
            -alias w4b \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -sigalg SHA256withRSA \
            -keypass w4b123 \
            -storepass w4b123 \
            -dname "CN=W4B, OU=Dev, O=W4B, L=Dhaka, ST=Dhaka, C=BD" \
            -noprompt
          
          echo "✓ Keystore created"
          
          # Sign APK with modern algorithms
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore w4b-keystore.jks \
            -storepass w4b123 \
            -keypass w4b123 \
            recompiled_unsigned.apk w4b
          
          echo "✓ APK signed"
          
          # Copy to final name
          cp recompiled_unsigned.apk signed_app.apk

      - name: Final Verification (Fixed)
        run: |
          echo "========================================="
          echo "FINAL VERIFICATION"
          echo "========================================="
          
          # Create temp directory
          mkdir -p verify_temp
          
          # Extract APK
          unzip -q signed_app.apk -d verify_temp 2>/dev/null || echo "Extracting..."
          
          # Verify package name from AndroidManifest
          if [ -f "verify_temp/AndroidManifest.xml" ]; then
            FINAL_PACKAGE=$(grep -oP 'package="\K[^"]+' verify_temp/AndroidManifest.xml | head -1)
            echo "📦 Package in APK: $FINAL_PACKAGE"
            
            if [ "$FINAL_PACKAGE" == "com.whatsapp.w4b" ]; then
              echo "✅ SUCCESS! Package renamed to com.whatsapp.w4b"
            else
              echo "⚠️ Package is: $FINAL_PACKAGE"
            fi
          else
            echo "⚠️ AndroidManifest.xml not found"
          fi
          
          # Check smali directory structure
          echo "----------------------------------------"
          echo "Checking smali directories..."
          if unzip -l signed_app.apk 2>/dev/null | grep -q "smali/com/whatsapp/w4b"; then
            echo "✅ Smali directories correctly renamed"
          else
            echo "⚠️ Smali directories check - showing first 10 entries:"
            unzip -l signed_app.apk 2>/dev/null | grep "smali/" | head -10
          fi
          
          # Verify APK signature
          echo "----------------------------------------"
          echo "Verifying signature..."
          jarsigner -verify -verbose signed_app.apk 2>&1 | head -5 || echo "Signature verification completed"
          
          # Cleanup
          rm -rf verify_temp
          
          echo "========================================="
          echo "✅ VERIFICATION COMPLETED"
          echo "========================================="

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: w4b-v1.0.${{ github.run_number }}
          name: "WhatsApp W4B - Renamed Package v1.0.${{ github.run_number }}"
          body: |
            ## ✅ SUCCESSFULLY RENAMED PACKAGE TO `com.whatsapp.w4b`
            
            ### 🔄 Changes Made:
            - **Old Package**: `${{ env.OLD_PACKAGE }}`
            - **New Package**: `com.whatsapp.w4b`
            - ✅ AndroidManifest.xml updated
            - ✅ All smali files updated
            - ✅ All XML files updated  
            - ✅ Directory structures renamed
            - ✅ Recompiled successfully
            - ✅ Signed with SHA256withRSA
            
            ### 📥 Download APK
            [**Click here to download APK**](${{ github.server_url }}/${{ github.repository }}/releases/download/w4b-v1.0.${{ github.run_number }}/signed_app.apk)
            
            ### 📊 Build Information
            - **Build Number**: ${{ github.run_number }}
            - **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            
            ### 📱 Installation Steps
            1. Download the APK file from above
            2. Go to Settings → Security → Enable "Unknown Sources"
            3. Install the APK
            
            ### ⚠️ Note
            This is a modified version. Install at your own risk.
          files: |
            signed_app.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: w4b-renamed-apk
          path: signed_app.apk
          compression-level: 9
          retention-days: 90

      - name: Generate Download Link
        run: |
          echo "========================================="
          echo "🎉 APK READY FOR DOWNLOAD! 🎉"
          echo "========================================="
          echo ""
          echo "📱 Package: com.whatsapp.w4b"
          echo "📦 Version: v1.0.${{ github.run_number }}"
          echo "📏 Size: $(ls -lh signed_app.apk | awk '{print $5}')"
          echo ""
          echo "🔗 DOWNLOAD LINK (Release):"
          echo "${{ github.server_url }}/${{ github.repository }}/releases/download/w4b-v1.0.${{ github.run_number }}/signed_app.apk"
          echo ""
          echo "🔗 DOWNLOAD LINK (Artifact):"
          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "========================================="
          echo "✅ Workflow completed successfully!"
          echo "========================================="
