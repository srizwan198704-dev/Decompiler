name: Full Package Rename to com.whatsapp.w4b

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java & APKTool
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless
          
          # Download APKTool
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          
          apktool --version

      - name: Detect Old Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Get package from AndroidManifest
          if [ -f "$DECOMPILED_DIR/AndroidManifest.xml" ]; then
            OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          fi
          
          if [ -z "$OLD_PACKAGE" ]; then
            OLD_PACKAGE="com.whatsapp"
          fi
          
          echo "OLD_PACKAGE=$OLD_PACKAGE" >> $GITHUB_ENV
          echo "Detected Old Package: $OLD_PACKAGE"

      - name: Fix AndroidManifest.xml
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Remove problematic attributes
          sed -i 's/requiredSplitTypes="[^"]*"//g' "$DECOMPILED_DIR/AndroidManifest.xml"
          sed -i 's/splitTypes="[^"]*"//g' "$DECOMPILED_DIR/AndroidManifest.xml"
          sed -i 's/isSplitRequired="[^"]*"//g' "$DECOMPILED_DIR/AndroidManifest.xml"
          sed -i 's/android:extractNativeLibs="[^"]*"//g' "$DECOMPILED_DIR/AndroidManifest.xml"
          sed -i 's/android:useEmbeddedDex="[^"]*"//g' "$DECOMPILED_DIR/AndroidManifest.xml"
          
          # Update package name
          sed -i "s/package=\"$OLD_PACKAGE\"/package=\"com.whatsapp.w4b\"/" "$DECOMPILED_DIR/AndroidManifest.xml"
          sed -i "s/$OLD_PACKAGE/com.whatsapp.w4b/g" "$DECOMPILED_DIR/AndroidManifest.xml"
          
          echo "✓ AndroidManifest.xml updated"

      - name: Rename Smali Directories
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          OLD_PATH=$(echo "$OLD_PACKAGE" | tr '.' '/')
          NEW_PATH="com/whatsapp/w4b"
          
          # Find all smali directories
          for smali_dir in $(find "$DECOMPILED_DIR" -type d -name "smali*" 2>/dev/null); do
            if [ -d "$smali_dir/$OLD_PATH" ]; then
              cd "$smali_dir"
              mkdir -p com/whatsapp
              mv "$OLD_PATH" "com/whatsapp/w4b" 2>/dev/null || true
              echo "Renamed in: $smali_dir"
              cd - > /dev/null
            fi
          done

      - name: Update Smali Files Content
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update all smali files
          find "$DECOMPILED_DIR" -type f -name "*.smali" 2>/dev/null | while read file; do
            sed -i "s|L$OLD_PACKAGE/|Lcom/whatsapp/w4b/|g" "$file"
            sed -i "s|$OLD_PACKAGE|com.whatsapp.w4b|g" "$file"
          done
          
          echo "✓ Updated smali files"

      - name: Update XML Files
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update all XML files
          find "$DECOMPILED_DIR" -type f -name "*.xml" 2>/dev/null | while read file; do
            sed -i "s|$OLD_PACKAGE|com.whatsapp.w4b|g" "$file"
          done
          
          echo "✓ Updated XML files"

      - name: Recompile APK
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          echo "=== Recompiling APK ==="
          apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk -f
          
          if [ -f "recompiled_unsigned.apk" ] && [ -s "recompiled_unsigned.apk" ]; then
            echo "✅ Recompilation successful!"
            ls -lh recompiled_unsigned.apk
          else
            echo "❌ Recompilation failed"
            exit 1
          fi

      - name: Sign APK
        run: |
          # Create keystore
          keytool -genkey -v \
            -keystore my.keystore \
            -alias w4b \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass w4b123 \
            -keypass w4b123 \
            -dname "CN=W4B, OU=Dev, O=W4B, L=Dhaka, ST=Dhaka, C=BD" \
            -noprompt
          
          # Sign APK
          jarsigner -keystore my.keystore \
            -storepass w4b123 \
            -keypass w4b123 \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            recompiled_unsigned.apk w4b
          
          cp recompiled_unsigned.apk signed_app.apk
          echo "✅ APK signed"

      - name: Verify APK
        run: |
          echo "========================================="
          echo "VERIFICATION"
          echo "========================================="
          
          if [ -f "signed_app.apk" ]; then
            SIZE=$(ls -lh signed_app.apk | awk '{print $5}')
            echo "✅ APK created: $SIZE"
            
            # Extract and check manifest
            unzip -p signed_app.apk AndroidManifest.xml > /tmp/manifest.xml 2>/dev/null
            if grep -q "com.whatsapp.w4b" /tmp/manifest.xml; then
              echo "✅ Package name verified: com.whatsapp.w4b"
            fi
          else
            echo "❌ APK not found"
            exit 1
          fi
          
          echo "========================================="

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: w4b-v1.0.${{ github.run_number }}
          name: "WhatsApp W4B v1.0.${{ github.run_number }}"
          body: |
            ✅ APK Successfully Recompiled!
            
            Package: com.whatsapp.w4b
            Build: ${{ github.run_number }}
            
            Download the APK from assets below.
          files: |
            signed_app.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: w4b-apk
          path: signed_app.apk
          retention-days: 90

      - name: Show Download Link
        run: |
          echo "========================================="
          echo "🎉 SUCCESS! 🎉"
          echo "========================================="
          echo ""
          echo "Download APK from:"
          echo "${{ github.server_url }}/${{ github.repository }}/releases/download/w4b-v1.0.${{ github.run_number }}/signed_app.apk"
          echo ""
          echo "Or check Artifacts tab"
          echo "========================================="
