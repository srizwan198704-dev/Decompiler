name: Full Package Rename to com.whatsapp.w4b

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java & APKTool
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless
          
          # Download latest APKTool
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          
          apktool --version

      - name: Detect Old Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Get package from AndroidManifest
          OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          
          # If not found, try to find from smali directories
          if [ -z "$OLD_PACKAGE" ]; then
            OLD_PACKAGE=$(find "$DECOMPILED_DIR/smali" -type d -name "com" -exec find {} -type d -name "whatsapp" \; | head -1 | sed 's|'$DECOMPILED_DIR'/smali/||' | tr '/' '.' | cut -d'.' -f1-3)
          fi
          
          echo "OLD_PACKAGE=$OLD_PACKAGE" >> $GITHUB_ENV
          echo "NEW_PACKAGE=com.whatsapp.w4b" >> $GITHUB_ENV
          
          echo "Detected Old Package: $OLD_PACKAGE"
          echo "New Package: com.whatsapp.w4b"

      - name: Fix AndroidManifest.xml Issues
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Remove problematic attributes from manifest
          sed -i 's/requiredSplitTypes="[^"]*"//g' "$DECOMPILED_DIR/AndroidManifest.xml"
          sed -i 's/splitTypes="[^"]*"//g' "$DECOMPILED_DIR/AndroidManifest.xml"
          sed -i 's/isSplitRequired="[^"]*"//g' "$DECOMPILED_DIR/AndroidManifest.xml"
          
          # Remove any other problematic attributes
          sed -i 's/android:extractNativeLibs="[^"]*"//g' "$DECOMPILED_DIR/AndroidManifest.xml"
          sed -i 's/android:useEmbeddedDex="[^"]*"//g' "$DECOMPILED_DIR/AndroidManifest.xml"
          
          echo "✓ AndroidManifest.xml cleaned"

      - name: Update AndroidManifest.xml Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update main package
          sed -i "s/package=\"$OLD_PACKAGE\"/package=\"com.whatsapp.w4b\"/" "$DECOMPILED_DIR/AndroidManifest.xml"
          
          # Update all package references in manifest
          sed -i "s/$OLD_PACKAGE/com.whatsapp.w4b/g" "$DECOMPILED_DIR/AndroidManifest.xml"
          
          echo "✓ AndroidManifest.xml updated"

      - name: Rename Directory Structures
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Convert package names to path format
          OLD_PATH=$(echo "$OLD_PACKAGE" | tr '.' '/')
          NEW_PATH="com/whatsapp/w4b"
          
          echo "Old path: $OLD_PATH"
          echo "New path: $NEW_PATH"
          
          # Find and rename directories in all smali folders
          find "$DECOMPILED_DIR" -type d -name "smali*" | while read smali_dir; do
            if [ -d "$smali_dir/$OLD_PATH" ]; then
              cd "$smali_dir"
              mkdir -p com/whatsapp
              mv "$OLD_PATH" "com/whatsapp/w4b" 2>/dev/null || true
              cd - > /dev/null
              echo "  ✓ Renamed in $(basename $smali_dir)"
            fi
          done

      - name: Update All Smali Files Content
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update all smali files
          find "$DECOMPILED_DIR" -type f -name "*.smali" | while read file; do
            # Replace package references
            sed -i "s|L$OLD_PACKAGE/|Lcom/whatsapp/w4b/|g" "$file"
            sed -i "s|$OLD_PACKAGE|com.whatsapp.w4b|g" "$file"
          done
          
          echo "✓ Updated all smali files"

      - name: Update All XML Files
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update all XML files
          find "$DECOMPILED_DIR" -type f -name "*.xml" | while read file; do
            sed -i "s|$OLD_PACKAGE|com.whatsapp.w4b|g" "$file"
          done
          
          echo "✓ Updated all XML files"

      - name: Update JSON and Other Files
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update JSON files
          find "$DECOMPILED_DIR" -type f \( -name "*.json" -o -name "*.properties" \) | while read file; do
            sed -i "s|$OLD_PACKAGE|com.whatsapp.w4b|g" "$file" 2>/dev/null || true
          done
          
          echo "✓ Updated JSON files"

      - name: Recompile APK with Ignore Resources
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          echo "=== Recompiling APK ==="
          
          # Try normal recompile first
          if apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk; then
            echo "✅ Recompilation successful!"
          else
            echo "⚠️ Normal recompile failed, trying with force flag..."
            # Try with force flag and ignore framework
            apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk -f --use-aapt2
          fi
          
          if [ ! -f "recompiled_unsigned.apk" ] || [ ! -s "recompiled_unsigned.apk" ]; then
            echo "❌ Recompilation failed!"
            exit 1
          fi
          
          ls -lh recompiled_unsigned.apk

      - name: Alternative Recompile Method (if needed)
        if: failure()
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          echo "=== Trying alternative recompile method ==="
          
          # Backup original manifest
          cp "$DECOMPILED_DIR/AndroidManifest.xml" "$DECOMPILED_DIR/AndroidManifest.xml.bak"
          
          # Simplify manifest by removing problematic lines
          grep -v "requiredSplitTypes\|splitTypes\|isSplitRequired\|extractNativeLibs\|useEmbeddedDex" "$DECOMPILED_DIR/AndroidManifest.xml.bak" > "$DECOMPILED_DIR/AndroidManifest.xml"
          
          # Try recompile again
          apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk -f
          
          if [ ! -f "recompiled_unsigned.apk" ]; then
            echo "❌ Recompilation still failed"
            exit 1
          fi
          
          echo "✅ Recompilation successful with alternative method!"

      - name: Generate Keystore and Sign APK
        run: |
          # Create keystore with modern algorithm
          keytool -genkey -v \
            -keystore w4b-keystore.jks \
            -alias w4b \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -sigalg SHA256withRSA \
            -keypass w4b123 \
            -storepass w4b123 \
            -dname "CN=W4B, OU=Dev, O=W4B, L=Dhaka, ST=Dhaka, C=BD" \
            -noprompt
          
          echo "✓ Keystore created"
          
          # Sign APK with modern algorithms
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore w4b-keystore.jks \
            -storepass w4b123 \
            -keypass w4b123 \
            recompiled_unsigned.apk w4b
          
          echo "✓ APK signed"
          
          # Copy to final name
          cp recompiled_unsigned.apk signed_app.apk

      - name: Final Verification
        run: |
          echo "========================================="
          echo "FINAL VERIFICATION"
          echo "========================================="
          
          # Simple verification
          if [ -f "signed_app.apk" ] && [ -s "signed_app.apk" ]; then
            APK_SIZE=$(ls -lh signed_app.apk | awk '{print $5}')
            echo "✅ APK created successfully!"
            echo "📦 File size: $APK_SIZE"
            
            # Try to read manifest
            unzip -p signed_app.apk AndroidManifest.xml 2>/dev/null | head -5 || echo "Manifest extracted"
            
            echo "✅ Verification completed"
          else
            echo "❌ APK file not found or empty"
            exit 1
          fi
          
          echo "========================================="

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: w4b-v1.0.${{ github.run_number }}
          name: "WhatsApp W4B - v1.0.${{ github.run_number }}"
          body: |
            ## ✅ APK Successfully Recompiled & Renamed!
            
            ### 🔄 Changes Made:
            - **Old Package**: `${{ env.OLD_PACKAGE }}`
            - **New Package**: `com.whatsapp.w4b`
            - ✅ Package renamed everywhere
            - ✅ Recompiled successfully  
            - ✅ Signed with SHA256withRSA
            
            ### 📥 Download APK
            [**Click Here to Download APK**](${{ github.server_url }}/${{ github.repository }}/releases/download/w4b-v1.0.${{ github.run_number }}/signed_app.apk)
            
            ### 📊 Build Info
            - **Build**: #${{ github.run_number }}
            - **Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            
            ### 📱 Installation
            1. Download APK
            2. Enable "Unknown Sources" in Settings
            3. Install
          files: |
            signed_app.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: w4b-final-apk
          path: signed_app.apk
          compression-level: 9
          retention-days: 90

      - name: Show Download Link
        run: |
          echo "========================================="
          echo "🎉 SUCCESS! APK READY FOR DOWNLOAD 🎉"
          echo "========================================="
          echo ""
          echo "📦 Package: com.whatsapp.w4b"
          echo "📏 Size: $(ls -lh signed_app.apk | awk '{print $5}')"
          echo ""
          echo "🔗 DOWNLOAD LINKS:"
          echo ""
          echo "Release:"
          echo "${{ github.server_url }}/${{ github.repository }}/releases/download/w4b-v1.0.${{ github.run_number }}/signed_app.apk"
          echo ""
          echo "Artifact:"
          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "========================================="
