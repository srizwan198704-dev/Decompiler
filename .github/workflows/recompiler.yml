name: W4B Recompile

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'
      new_package:
        description: 'New package name (leave blank = com.whatsapp.w4b)'
        required: false
        default: 'com.whatsapp.w4b'
      apktool_version:
        description: 'APKTool version'
        required: false
        default: '2.10.0'
      build_tools_version:
        description: 'Android build-tools version'
        required: false
        default: '34.0.0'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      NEW_PACKAGE: ${{ github.event.inputs.new_package || 'com.whatsapp.w4b' }}
      APKTOOL_VER: ${{ github.event.inputs.apktool_version || '2.10.0' }}
      BUILD_TOOLS_VER: ${{ github.event.inputs.build_tools_version || '34.0.0' }}

    steps:
      # ─────────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. JAVA + SYSTEM DEPS
      # ─────────────────────────────────────────────
      - name: Setup Java 17 & system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jre-headless \
            zipalign \
            wget \
            unzip \
            python3 \
            xmlstarlet \
            findutils \
            coreutils
          java -version

      # ─────────────────────────────────────────────
      # 3. ANDROID SDK + BUILD-TOOLS
      # ─────────────────────────────────────────────
      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O cmdline-tools.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools \
                  /opt/android-sdk/cmdline-tools/latest

          export ANDROID_SDK_ROOT=/opt/android-sdk
          export PATH="$PATH:/opt/android-sdk/cmdline-tools/latest/bin"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;${{ env.BUILD_TOOLS_VER }}"

          BT_PATH="/opt/android-sdk/build-tools/${{ env.BUILD_TOOLS_VER }}"
          sudo ln -sf "$BT_PATH/aapt2"      /usr/local/bin/aapt2
          sudo ln -sf "$BT_PATH/apksigner"  /usr/local/bin/apksigner
          sudo ln -sf "$BT_PATH/zipalign"   /usr/local/bin/zipalign

          echo "$BT_PATH"          >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV

          echo "=== Tool versions ==="
          aapt2 version
          apksigner version
          zipalign

      # ─────────────────────────────────────────────
      # 4. APKTOOL (with -m / merge support)
      # ─────────────────────────────────────────────
      - name: Setup APKTool ${{ env.APKTOOL_VER }}
        run: |
          sudo wget -q \
            https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool \
            -O /usr/local/bin/apktool
          sudo wget -q \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${{ env.APKTOOL_VER }}/apktool_${{ env.APKTOOL_VER }}.jar" \
            -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          apktool --version

      # ─────────────────────────────────────────────
      # 5. DETECT OLD PACKAGE NAME
      # ─────────────────────────────────────────────
      - name: Detect old package name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD_PACKAGE=""

          if [ -f "$DECOMPILED_DIR/AndroidManifest.xml" ]; then
            OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          fi

          if [ -z "$OLD_PACKAGE" ]; then
            OLD_PACKAGE="com.whatsapp"
            echo "WARNING: Could not detect package — defaulting to $OLD_PACKAGE"
          fi

          echo "OLD_PACKAGE=$OLD_PACKAGE"       >> $GITHUB_ENV
          echo "OLD_PATH=$(echo $OLD_PACKAGE | tr '.' '/')" >> $GITHUB_ENV
          echo "NEW_PATH=$(echo ${{ env.NEW_PACKAGE }} | tr '.' '/')" >> $GITHUB_ENV
          echo "Detected old package: $OLD_PACKAGE"
          echo "Target new package : ${{ env.NEW_PACKAGE }}"

      # ─────────────────────────────────────────────
      # 6. FIX MALFORMED SMALI FILENAMES
      # ─────────────────────────────────────────────
      - name: Fix malformed smali filenames
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          RENAMED=0

          while IFS= read -r -d '' file; do
            if [[ "$file" =~ [^a-zA-Z0-9_./-] ]]; then
              dir=$(dirname "$file")
              safe_name=$(echo "$(basename "$file" .smali)" | md5sum | cut -c1-16)
              safe_file="$dir/${safe_name}.smali"
              echo "Renaming: $file -> $safe_file"
              mv "$file" "$safe_file"
              RENAMED=$((RENAMED + 1))
            fi
          done < <(find "$DECOMPILED_DIR" -type f -name "*.smali" -print0)

          echo "Renamed $RENAMED malformed smali files"

      # ─────────────────────────────────────────────
      # 7. FIX INVALID DIRECTIVES IN SMALI
      # ─────────────────────────────────────────────
      - name: Fix invalid directives in smali files
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"

          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i \
            -e 's/\.whatsapp\b/Lcom\/whatsapp/g' \
            -e 's/\.w4b\b/Lcom\/w4b/g' \
            -e 's/\.whatsapp\/Features\b/Lcom\/whatsapp\/Features/g' \
            -e 's/\.w4b\/Features\b/Lcom\/w4b\/Features/g' \
            -e 's/\bLcom\b/L/g' \
            -e 's/L\./L/g' {} +

          echo "Invalid-directive fix done"

      # ─────────────────────────────────────────────
      # 8. PACKAGE RENAME – AndroidManifest.xml
      # ─────────────────────────────────────────────
      - name: Rename package in AndroidManifest.xml
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="${{ env.NEW_PACKAGE }}"

          cp "$MANIFEST" "$MANIFEST.bak"

          python3 - "$OLD" "$NEW" "$MANIFEST" << 'PYEOF'
          import re, sys, xml.etree.ElementTree as ET

          old, new, path = sys.argv[1], sys.argv[2], sys.argv[3]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          result = re.sub(r'\b' + re.escape(old) + r'\b', new, content)

          with open(path, "w", encoding="utf-8") as f:
              f.write(result)

          print(f"Replaced: {old} -> {new}")

          try:
              ET.parse(path)
              print("XML validation: OK")
          except ET.ParseError as e:
              print(f"XML ERROR: {e}")
              sys.exit(1)
          PYEOF

      # ─────────────────────────────────────────────
      # 9. PACKAGE RENAME – SMALI FILES
      # ─────────────────────────────────────────────
      - name: Rename package in smali & xml files
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD_PATH="${{ env.OLD_PATH }}"
          NEW_PATH="${{ env.NEW_PATH }}"
          OLD_DOT=$(echo "${{ env.OLD_PACKAGE }}" | sed 's/\./\\./g')
          NEW_DOT="${{ env.NEW_PACKAGE }}"

          echo "Path-based: $OLD_PATH -> $NEW_PATH"

          # Smali class/type references (Lcom/whatsapp/... style)
          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i \
            -e "s|L${OLD_PATH}/|L${NEW_PATH}/|g" \
            -e "s|${OLD_PATH}/|${NEW_PATH}/|g" {} +

          # Dot-notation in smali + xml
          find "$DECOMPILED_DIR" -type f \( -name "*.smali" -o -name "*.xml" \) \
            -exec sed -i "s/\b${OLD_DOT}\b/${NEW_DOT}/g" {} +

          echo "Package rename in smali/xml done"

      # ─────────────────────────────────────────────
      # 10. CLEANUP MALFORMED DIRECTIVES
      # ─────────────────────────────────────────────
      - name: Cleanup remaining malformed directives
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"

          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i \
            -e 's/\.whatsapp\b//g' \
            -e 's/\.w4b\b//g' \
            -e 's/\binvalid directive\b//gi' \
            -e '/^\.class/s/[^a-zA-Z0-9_$. \/;:-]//g' {} +

          echo "Cleanup done"

      # ─────────────────────────────────────────────
      # 11. FIX SMALI SYNTAX ERRORS
      # ─────────────────────────────────────────────
      - name: Fix smali syntax errors
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"

          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i \
            -e 's/Features;/Lcom\/whatsapp\/w4b\/Features;/g' \
            -e 's/\/Features /\/Features;/g' {} +

          echo "Syntax fix done"

      # ─────────────────────────────────────────────
      # 12. VALIDATE SMALI (pre-build check)
      # ─────────────────────────────────────────────
      - name: Validate smali files (pre-build)
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=== Checking for residual invalid directives ==="

          ISSUES=$(find "$DECOMPILED_DIR" -name "*.smali" -exec grep -Hn '^\.' {} \; | \
            grep -v \
              -e '\.class' -e '\.super' -e '\.source' \
              -e '\.method' -e '\.end method' \
              -e '\.field' -e '\.end field' \
              -e '\.annotation' -e '\.end annotation' \
              -e '\.line' -e '\.parameter' -e '\.param' \
              -e '\.locals' -e '\.registers' \
              -e '\.prologue' -e '\.epilogue' \
              -e '\.catch' -e '\.catchall' \
              -e '\.packed-switch' -e '\.sparse-switch' \
              -e '\.end packed-switch' -e '\.end sparse-switch' \
              -e '\.array-data' -e '\.end array-data' \
              -e '\.restart' -e '\.implements' -e '\.enum' \
              -e '\.value' -e '\.subannotation' -e '\.end subannotation' \
            2>/dev/null | head -30)

          if [ -n "$ISSUES" ]; then
            echo "WARNINGS (may be non-fatal):"
            echo "$ISSUES"
          else
            echo "No major smali issues found ✓"
          fi

      # ─────────────────────────────────────────────
      # 13. RECOMPILE WITH apktool m (MERGE MODE)
      #     Falls back through b → b --use-aapt2
      # ─────────────────────────────────────────────
      - name: Recompile APK (apktool m with fallbacks)
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          OUT="recompiled_unsigned.apk"

          # Always clear cached framework first
          apktool empty-framework-dir --force 2>/dev/null || true

          BUILD_SUCCESS=false

          # ── Strategy 1: apktool m (merge — keeps original res/assets) ──
          echo "=== Strategy 1: apktool m (merge mode) ==="
          if apktool m "$DIR" -o "$OUT" -f 2>&1; then
            echo "✓ Build success — merge mode"
            BUILD_SUCCESS=true

          # ── Strategy 2: apktool m + --use-aapt2 ──
          elif apktool m "$DIR" -o "$OUT" -f --use-aapt2 2>&1; then
            echo "✓ Build success — merge + aapt2"
            BUILD_SUCCESS=true

          # ── Strategy 3: apktool b (standard build) ──
          elif apktool b "$DIR" -o "$OUT" -f 2>&1; then
            echo "✓ Build success — standard build"
            BUILD_SUCCESS=true

          # ── Strategy 4: apktool b + --use-aapt2 ──
          elif apktool b "$DIR" -o "$OUT" -f --use-aapt2 2>&1; then
            echo "✓ Build success — standard + aapt2"
            BUILD_SUCCESS=true

          # ── Strategy 5: apktool b + --use-aapt2 + --no-crunch ──
          elif apktool b "$DIR" -o "$OUT" -f --use-aapt2 --no-crunch 2>&1; then
            echo "✓ Build success — aapt2 + no-crunch"
            BUILD_SUCCESS=true

          else
            echo "✗ All build strategies failed"
          fi

          if [ "$BUILD_SUCCESS" != "true" ] || [ ! -f "$OUT" ]; then
            echo "ERROR: APK not created — aborting"
            exit 1
          fi

          ls -lh "$OUT"

      # ─────────────────────────────────────────────
      # 14. VERIFY APK STRUCTURE
      # ─────────────────────────────────────────────
      - name: Verify APK structure
        run: |
          echo "=== aapt2 badging ==="
          aapt2 dump badging recompiled_unsigned.apk 2>&1 | head -10 || \
            echo "Warning: aapt2 dump failed (APK may still be installable)"

          echo "=== APK entry count ==="
          unzip -l recompiled_unsigned.apk | tail -3

      # ─────────────────────────────────────────────
      # 15. GENERATE KEYSTORE
      # ─────────────────────────────────────────────
      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore my.keystore \
            -alias w4b \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass w4b123 \
            -keypass w4b123 \
            -dname "CN=W4B,OU=Dev,O=W4B,L=Dhaka,ST=Dhaka,C=BD" \
            -noprompt
          echo "Keystore generated ✓"

      # ─────────────────────────────────────────────
      # 16. ZIPALIGN  (must come BEFORE apksigner)
      # ─────────────────────────────────────────────
      - name: Zipalign APK
        run: |
          zipalign -v -p 4 recompiled_unsigned.apk aligned.apk
          zipalign -c -v 4 aligned.apk && echo "Alignment: PASSED ✓" || echo "Alignment: FAILED ✗"

      # ─────────────────────────────────────────────
      # 17. SIGN WITH apksigner (v2 + v3 schemes)
      # ─────────────────────────────────────────────
      - name: Sign APK with apksigner
        run: |
          apksigner sign \
            --ks my.keystore \
            --ks-pass pass:w4b123 \
            --key-pass pass:w4b123 \
            --ks-key-alias w4b \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out signed_app.apk \
            aligned.apk

          echo "Signing done ✓"
          apksigner verify --verbose --print-certs signed_app.apk 2>&1 | head -20
          ls -lh signed_app.apk

      # ─────────────────────────────────────────────
      # 18. UPLOAD ARTIFACT
      # ─────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: w4b-apk-${{ github.run_number }}
          path: signed_app.apk
          retention-days: 90

      # ─────────────────────────────────────────────
      # 19. CREATE GITHUB RELEASE
      # ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: w4b-v1.0.${{ github.run_number }}
          name: "W4B v1.0.${{ github.run_number }}"
          body: |
            ## W4B Recompile — Build #${{ github.run_number }}

            | Field        | Value |
            |---|---|
            | 📦 Old package | `${{ env.OLD_PACKAGE }}` |
            | ✅ New package | `${{ env.NEW_PACKAGE }}` |
            | 🔧 APKTool    | v${{ env.APKTOOL_VER }} (merge mode) |
            | 🛠 Build-tools | ${{ env.BUILD_TOOLS_VER }} |
            | 🔑 Signed     | v2 + v3 (apksigner) |

            ### Fixes applied
            - Malformed smali filenames renamed (md5 safe names)
            - Invalid `.whatsapp` / `.w4b` directives corrected
            - Broken `Features;` class references repaired
            - Dot-notation & path-based package references replaced
            - `AndroidManifest.xml` validated after replacement

            ### Build strategy
            `apktool m` (merge) → `apktool m --use-aapt2` → `apktool b` → `apktool b --use-aapt2` → `apktool b --use-aapt2 --no-crunch`
          files: signed_app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
