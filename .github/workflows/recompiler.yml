name: Recompile & Rename Package to com.whatsapp.w4b

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name (যে ফোল্ডার ডিকম্পাইল করা আছে)'
        required: true
        default: 'decompiled_app'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java & APKTool
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre-headless
          
          # Download APKTool
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          
          apktool --version

      - name: Detect Current Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Get current package name from AndroidManifest.xml
          CURRENT_PACKAGE=$(grep -oP 'package="\K[^"]+' "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          
          if [ -z "$CURRENT_PACKAGE" ]; then
            echo "Could not find package in AndroidManifest.xml"
            # Try to find from smali folders
            CURRENT_PACKAGE=$(find "$DECOMPILED_DIR/smali" -type d -name "com" -exec find {} -type d -name "whatsapp" \; | head -1 | sed 's|/|.|g' | cut -d'.' -f1-3)
          fi
          
          echo "CURRENT_PACKAGE=$CURRENT_PACKAGE" >> $GITHUB_ENV
          echo "Found current package: $CURRENT_PACKAGE"

      - name: Update AndroidManifest.xml
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update package name in manifest
          sed -i 's/package="[^"]*"/package="com.whatsapp.w4b"/' "$DECOMPILED_DIR/AndroidManifest.xml"
          
          # Update any provider authorities and other references
          sed -i 's/${applicationId}/com.whatsapp.w4b/g' "$DECOMPILED_DIR/AndroidManifest.xml"
          
          echo "✓ Updated AndroidManifest.xml"
          grep "package=" "$DECOMPILED_DIR/AndroidManifest.xml"

      - name: Rename Smali Directories
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD_PACKAGE_PATH=$(echo "$CURRENT_PACKAGE" | tr '.' '/')
          NEW_PACKAGE_PATH="com/whatsapp/w4b"
          
          echo "Old path: $OLD_PACKAGE_PATH"
          echo "New path: $NEW_PACKAGE_PATH"
          
          # Find and rename directories in all smali folders
          find "$DECOMPILED_DIR" -type d -path "*/smali*" | while read smali_dir; do
            echo "Processing: $smali_dir"
            
            cd "$smali_dir"
            
            # Check if old package exists
            if [ -d "$OLD_PACKAGE_PATH" ]; then
              # Create parent directories
              mkdir -p "$(dirname "$NEW_PACKAGE_PATH")"
              # Move the directory
              mv "$OLD_PACKAGE_PATH" "$NEW_PACKAGE_PATH" 2>/dev/null || echo "Already moved"
              echo "  ✓ Renamed in $(basename $smali_dir)"
            fi
            
            cd - > /dev/null
          done

      - name: Update All Smali Files Content
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD_PACKAGE_SLASH=$(echo "$CURRENT_PACKAGE" | tr '.' '/')
          NEW_PACKAGE_SLASH="com/whatsapp/w4b"
          OLD_PACKAGE_DOT="$CURRENT_PACKAGE"
          NEW_PACKAGE_DOT="com.whatsapp.w4b"
          
          # Update all .smali files
          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i "s|L$OLD_PACKAGE_SLASH/|L$NEW_PACKAGE_SLASH/|g" {} \;
          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i "s|$OLD_PACKAGE_DOT|$NEW_PACKAGE_DOT|g" {} \;
          
          # Update all .xml files
          find "$DECOMPILED_DIR" -type f -name "*.xml" -exec sed -i "s|$OLD_PACKAGE_DOT|$NEW_PACKAGE_DOT|g" {} \;
          
          echo "✓ Updated all file contents"

      - name: Recompile APK
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          echo "=== Recompiling APK ==="
          apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk
          
          if [ ! -f "recompiled_unsigned.apk" ]; then
            echo "Recompilation failed!"
            exit 1
          fi
          
          echo "✓ Recompilation completed!"
          ls -lh recompiled_unsigned.apk

      - name: Sign APK with Uber APK Signer
        run: |
          # Download uber-apk-signer (easier and more reliable)
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          
          # Sign the APK
          java -jar uber-apk-signer-1.3.0.jar --apks recompiled_unsigned.apk --out . --ksAlias w4b --ksKeyPass w4b123 --ksPass w4b123 --ks common
          
          # Rename the signed APK
          mv recompiled_unsigned-aligned-debugSigned.apk signed_app.apk 2>/dev/null || mv recompiled_unsigned-*.apk signed_app.apk
          
          echo "✓ APK signed successfully!"

      - name: Verify Signed APK
        run: |
          echo "=== Signed APK Information ==="
          ls -lh signed_app.apk
          
          # Extract and verify package name
          unzip -q signed_app.apk -d temp_verify
          if [ -f "temp_verify/AndroidManifest.xml" ]; then
            PACKAGE=$(grep -oP 'package="\K[^"]+' temp_verify/AndroidManifest.xml)
            echo "✓ Package name in signed APK: $PACKAGE"
            
            if [ "$PACKAGE" == "com.whatsapp.w4b" ]; then
              echo "✅ Package renamed successfully to com.whatsapp.w4b!"
            else
              echo "⚠️ Package name is: $PACKAGE"
            fi
            rm -rf temp_verify
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: whatsapp-w4b-v1.0.${{ github.run_number }}
          name: "WhatsApp W4B - Modified APK"
          body: |
            ## ✅ Successfully Recompiled & Signed APK
            
            ### 📦 Package Information
            - **Package Name**: `com.whatsapp.w4b`
            - **Version**: v1.0.${{ github.run_number }}
            - **Build Date**: $(date)
            
            ### 🔧 Modifications Made
            - ✅ Package renamed from `${{ env.CURRENT_PACKAGE }}` to `com.whatsapp.w4b`
            - ✅ APK recompiled successfully
            - ✅ Signed with custom keystore
            
            ### 📥 How to Download
            1. Click on the **Assets** dropdown below
            2. Download `signed_app.apk`
            3. Install on your Android device
            
            ### ⚠️ Important Notes
            - You may need to enable "Install from Unknown Sources"
            - This is a modified version of the original APK
            - Use at your own risk
            
            ### 🔗 Direct Download Link
            [Download APK](https://github.com/${{ github.repository }}/releases/download/whatsapp-w4b-v1.0.${{ github.run_number }}/signed_app.apk)
          files: |
            signed_app.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-w4b-signed-apk
          path: |
            signed_app.apk
            recompiled_unsigned.apk
          compression-level: 9
          retention-days: 90

      - name: Success Message
        run: |
          echo "========================================="
          echo "✅ APK Successfully Recompiled & Signed!"
          echo "========================================="
          echo "📱 Package: com.whatsapp.w4b"
          echo "📦 Release: whatsapp-w4b-v1.0.${{ github.run_number }}"
          echo ""
          echo "🔗 DOWNLOAD LINK:"
          echo "https://github.com/${{ github.repository }}/releases/download/whatsapp-w4b-v1.0.${{ github.run_number }}/signed_app.apk"
          echo ""
          echo "🎉 You can now download the APK from the link above!"
          echo "========================================="
