name: Recompile & Rename Package to com.whatsapp.w4b

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java & APKTool
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre-headless
          
          # Download APKTool
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          
          # Install zipalign
          sudo apt-get install -y android-sdk-build-tools
          
          apktool --version

      - name: Detect Current Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Get current package name from AndroidManifest.xml
          CURRENT_PACKAGE=$(grep -oP 'package="\K[^"]+' "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          
          if [ -z "$CURRENT_PACKAGE" ]; then
            CURRENT_PACKAGE="com.whatsapp"
          fi
          
          echo "CURRENT_PACKAGE=$CURRENT_PACKAGE" >> $GITHUB_ENV
          echo "Found current package: $CURRENT_PACKAGE"

      - name: Update AndroidManifest.xml
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update package name in manifest
          sed -i 's/package="[^"]*"/package="com.whatsapp.w4b"/' "$DECOMPILED_DIR/AndroidManifest.xml"
          
          echo "✓ Updated AndroidManifest.xml"
          cat "$DECOMPILED_DIR/AndroidManifest.xml" | grep "package="

      - name: Rename Smali Directories
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD_PACKAGE_PATH=$(echo "$CURRENT_PACKAGE" | tr '.' '/')
          NEW_PACKAGE_PATH="com/whatsapp/w4b"
          
          echo "Old path: $OLD_PACKAGE_PATH"
          echo "New path: $NEW_PACKAGE_PATH"
          
          # Find and rename directories in all smali folders
          find "$DECOMPILED_DIR" -type d -path "*/smali*" | while read smali_dir; do
            if [ -d "$smali_dir/$OLD_PACKAGE_PATH" ]; then
              cd "$smali_dir"
              mkdir -p "$(dirname "$NEW_PACKAGE_PATH")"
              mv "$OLD_PACKAGE_PATH" "$NEW_PACKAGE_PATH" 2>/dev/null || echo "Already moved"
              cd - > /dev/null
              echo "  ✓ Renamed in $(basename $smali_dir)"
            fi
          done

      - name: Update All Smali Files Content
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD_PACKAGE_SLASH=$(echo "$CURRENT_PACKAGE" | tr '.' '/')
          NEW_PACKAGE_SLASH="com/whatsapp/w4b"
          OLD_PACKAGE_DOT="$CURRENT_PACKAGE"
          NEW_PACKAGE_DOT="com.whatsapp.w4b"
          
          # Update all .smali files
          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i "s|L$OLD_PACKAGE_SLASH/|L$NEW_PACKAGE_SLASH/|g" {} \;
          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i "s|$OLD_PACKAGE_DOT|$NEW_PACKAGE_DOT|g" {} \;
          
          # Update all .xml files
          find "$DECOMPILED_DIR" -type f -name "*.xml" -exec sed -i "s|$OLD_PACKAGE_DOT|$NEW_PACKAGE_DOT|g" {} \;
          
          echo "✓ Updated all file contents"

      - name: Recompile APK
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          echo "=== Recompiling APK ==="
          apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk
          
          if [ ! -f "recompiled_unsigned.apk" ]; then
            echo "Recompilation failed!"
            exit 1
          fi
          
          echo "✓ Recompilation completed!"
          ls -lh recompiled_unsigned.apk

      - name: Generate Keystore and Sign APK
        run: |
          # Create keystore
          keytool -genkey -v \
            -keystore my-release-key.keystore \
            -alias w4b \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass w4b123 \
            -keypass w4b123 \
            -dname "CN=W4B, OU=Dev, O=W4B, L=Dhaka, ST=Dhaka, C=BD" \
            -noprompt
          
          echo "✓ Keystore created successfully"
          
          # Sign the APK using jarsigner
          jarsigner -verbose \
            -sigalg SHA1withRSA \
            -digestalg SHA1 \
            -keystore my-release-key.keystore \
            -storepass w4b123 \
            -keypass w4b123 \
            recompiled_unsigned.apk w4b
          
          echo "✓ APK signed successfully"
          
          # Verify signature
          jarsigner -verify recompiled_unsigned.apk
          
          # Copy to final name
          cp recompiled_unsigned.apk signed_app.apk
          
          ls -lh signed_app.apk

      - name: Verify Package Name in Signed APK
        run: |
          # Extract AndroidManifest.xml from signed APK
          unzip -q signed_app.apk AndroidManifest.xml
          
          if [ -f "AndroidManifest.xml" ]; then
            PACKAGE=$(grep -oP 'package="\K[^"]+' AndroidManifest.xml)
            echo "✓ Package name in final APK: $PACKAGE"
            
            if [ "$PACKAGE" == "com.whatsapp.w4b" ]; then
              echo "✅ SUCCESS! Package renamed to com.whatsapp.w4b"
            else
              echo "⚠️ Package is: $PACKAGE"
            fi
            rm AndroidManifest.xml
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: whatsapp-w4b-v1.0.${{ github.run_number }}
          name: "WhatsApp W4B - v1.0.${{ github.run_number }}"
          body: |
            ## ✅ Successfully Recompiled & Signed APK!
            
            ### 📦 APK Information
            - **Package Name**: `com.whatsapp.w4b`
            - **Version**: v1.0.${{ github.run_number }}
            - **Build Date**: `$(date -u +"%Y-%m-%d %H:%M:%S UTC")`
            
            ### 🔧 Modifications
            - ✅ Package renamed from `${{ env.CURRENT_PACKAGE }}` → `com.whatsapp.w4b`
            - ✅ Recompiled successfully
            - ✅ Signed with custom keystore
            
            ### 📥 Download Instructions
            1. **Click "Assets" dropdown below**
            2. **Download `signed_app.apk`**
            3. Install on your Android device
            
            ### ⚠️ Note
            - Enable "Install from Unknown Sources" in settings
            - This is a modified APK - use at your own risk
            
            ### 🔗 Direct Download
            [Click here to download APK](${{ github.server_url }}/${{ github.repository }}/releases/download/whatsapp-w4b-v1.0.${{ github.run_number }}/signed_app.apk)
            
            ---
            *Generated by GitHub Actions*
          files: |
            signed_app.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact Backup
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-w4b-apk
          path: |
            signed_app.apk
            recompiled_unsigned.apk
          compression-level: 9
          retention-days: 90

      - name: Final Success Message
        run: |
          echo "========================================="
          echo "🎉 APK RECOMPILED & SIGNED SUCCESSFULLY! 🎉"
          echo "========================================="
          echo ""
          echo "📱 APK Details:"
          echo "   Package: com.whatsapp.w4b"
          echo "   Version: v1.0.${{ github.run_number }}"
          echo "   File: signed_app.apk"
          echo "   Size: $(ls -lh signed_app.apk | awk '{print $5}')"
          echo ""
          echo "🔗 DOWNLOAD APK FROM:"
          echo "   ${{ github.server_url }}/${{ github.repository }}/releases/download/whatsapp-w4b-v1.0.${{ github.run_number }}/signed_app.apk"
          echo ""
          echo "📦 Or check Artifacts tab"
          echo "========================================="
