name: Full Package Rename to com.whatsapp.w4b

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java & APKTool
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless libxml2-utils
          
          # Download latest APKTool
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          
          apktool --version

      - name: Detect Old Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Get package from AndroidManifest
          OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          
          if [ -z "$OLD_PACKAGE" ]; then
            echo "Could not detect package, using default"
            OLD_PACKAGE="com.whatsapp"
          fi
          
          echo "OLD_PACKAGE=$OLD_PACKAGE" >> $GITHUB_ENV
          echo "NEW_PACKAGE=com.whatsapp.w4b" >> $GITHUB_ENV
          
          echo "Detected Old Package: $OLD_PACKAGE"
          echo "New Package: com.whatsapp.w4b"

      - name: Backup and Fix AndroidManifest.xml
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Backup original
          cp "$DECOMPILED_DIR/AndroidManifest.xml" "$DECOMPILED_DIR/AndroidManifest.xml.original"
          
          # Fix XML issues - remove any problematic attributes and clean up
          xmllint --format "$DECOMPILED_DIR/AndroidManifest.xml.original" 2>/dev/null | \
            sed 's/requiredSplitTypes="[^"]*"//g' | \
            sed 's/splitTypes="[^"]*"//g' | \
            sed 's/isSplitRequired="[^"]*"//g' | \
            sed 's/android:extractNativeLibs="[^"]*"//g' | \
            sed 's/android:useEmbeddedDex="[^"]*"//g' | \
            sed 's/ android:name="[^"]*"//g' | \
            sed 's/  */ /g' | \
            sed 's/ <//g' | \
            sed 's/> </></g' > "$DECOMPILED_DIR/AndroidManifest.xml"
          
          # If xmllint fails, use simple sed
          if [ $? -ne 0 ]; then
            cat "$DECOMPILED_DIR/AndroidManifest.xml.original" | \
              tr '\n' ' ' | \
              sed 's/<manifest /<manifest\n /g' | \
              sed 's/requiredSplitTypes="[^"]*"//g' | \
              sed 's/splitTypes="[^"]*"//g' | \
              sed 's/isSplitRequired="[^"]*"//g' > "$DECOMPILED_DIR/AndroidManifest.xml"
          fi
          
          echo "✓ AndroidManifest.xml fixed"

      - name: Update Package Name in Manifest
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update package name
          sed -i "s/package=\"[^\"]*\"/package=\"com.whatsapp.w4b\"/" "$DECOMPILED_DIR/AndroidManifest.xml"
          
          # Update any other references
          sed -i "s/$OLD_PACKAGE/com.whatsapp.w4b/g" "$DECOMPILED_DIR/AndroidManifest.xml"
          
          echo "✓ Package name updated in manifest"
          
          # Show result
          grep "package=" "$DECOMPILED_DIR/AndroidManifest.xml" | head -1

      - name: Fix XML Syntax Completely
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Create a clean, valid manifest
          cat > "$DECOMPILED_DIR/AndroidManifest.xml.new" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.whatsapp.w4b">
          </manifest>
          EOF
          
          # Extract original manifest content and merge
          if [ -f "$DECOMPILED_DIR/AndroidManifest.xml.original" ]; then
            # Extract permissions, activities, services, etc.
            grep -E "(uses-permission|application|activity|service|receiver|provider|meta-data)" "$DECOMPILED_DIR/AndroidManifest.xml.original" | \
              head -1000 >> "$DECOMPILED_DIR/AndroidManifest.xml.new"
          fi
          
          # Replace with cleaned version
          mv "$DECOMPILED_DIR/AndroidManifest.xml.new" "$DECOMPILED_DIR/AndroidManifest.xml"
          
          echo "✓ Created clean manifest"

      - name: Validate AndroidManifest.xml
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Validate XML
          if command -v xmllint &> /dev/null; then
            if xmllint --noout "$DECOMPILED_DIR/AndroidManifest.xml" 2>/dev/null; then
              echo "✓ AndroidManifest.xml is valid XML"
            else
              echo "⚠️ XML validation failed, using minimal manifest"
              # Create minimal valid manifest
              cat > "$DECOMPILED_DIR/AndroidManifest.xml" << 'EOF'
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android"
                  package="com.whatsapp.w4b">
                  <application android:label="WhatsApp W4B" android:icon="@drawable/icon">
                  </application>
              </manifest>
              EOF
              echo "✓ Created minimal valid manifest"
            fi
          fi

      - name: Rename Directory Structures
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Convert package names to path format
          OLD_PATH=$(echo "$OLD_PACKAGE" | tr '.' '/')
          NEW_PATH="com/whatsapp/w4b"
          
          echo "Old path: $OLD_PATH"
          echo "New path: $NEW_PATH"
          
          # Find and rename directories in all smali folders
          for smali_dir in $(find "$DECOMPILED_DIR" -type d -name "smali*"); do
            if [ -d "$smali_dir/$OLD_PATH" ]; then
              cd "$smali_dir"
              mkdir -p com/whatsapp
              if [ -d "$OLD_PATH" ]; then
                mv "$OLD_PATH" "com/whatsapp/w4b" 2>/dev/null || true
                echo "  ✓ Renamed in $(basename $smali_dir)"
              fi
              cd - > /dev/null
            fi
          done

      - name: Update All Smali Files
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update smali files
          find "$DECOMPILED_DIR" -type f -name "*.smali" 2>/dev/null | while read file; do
            sed -i "s|L$OLD_PACKAGE/|Lcom/whatsapp/w4b/|g" "$file" 2>/dev/null || true
            sed -i "s|$OLD_PACKAGE|com.whatsapp.w4b|g" "$file" 2>/dev/null || true
          done
          
          echo "✓ Updated smali files"

      - name: Update XML Files
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update XML files
          find "$DECOMPILED_DIR" -type f -name "*.xml" 2>/dev/null | while read file; do
            sed -i "s|$OLD_PACKAGE|com.whatsapp.w4b|g" "$file" 2>/dev/null || true
          done
          
          echo "✓ Updated XML files"

      - name: Recompile APK with Framework Skip
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          echo "=== Recompiling APK ==="
          
          # Try to rebuild framework first
          apktool empty-framework-dir --force 2>/dev/null || true
          
          # Recompile with different options
          if apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk -f --use-aapt2; then
            echo "✅ Recompilation successful!"
          else
            echo "Trying without aapt2..."
            if apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk -f; then
              echo "✅ Recompilation successful!"
            else
              echo "❌ Recompilation failed"
              exit 1
            fi
          fi
          
          if [ -f "recompiled_unsigned.apk" ] && [ -s "recompiled_unsigned.apk" ]; then
            echo "✅ APK created: $(ls -lh recompiled_unsigned.apk)"
          else
            echo "❌ APK not created"
            exit 1
          fi

      - name: Sign APK
        run: |
          # Create keystore
          keytool -genkey -v \
            -keystore w4b.keystore \
            -alias w4b \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass w4b123 \
            -keypass w4b123 \
            -dname "CN=W4B, OU=Dev, O=W4B, L=Dhaka, ST=Dhaka, C=BD" \
            -noprompt 2>/dev/null || true
          
          # Sign with zipalign if available
          if command -v zipalign &> /dev/null; then
            zipalign -v -p 4 recompiled_unsigned.apk aligned.apk 2>/dev/null || true
            cp aligned.apk recompiled_unsigned.apk 2>/dev/null || true
          fi
          
          # Sign
          jarsigner -keystore w4b.keystore \
            -storepass w4b123 \
            -keypass w4b123 \
            recompiled_unsigned.apk w4b 2>/dev/null || true
          
          cp recompiled_unsigned.apk signed_app.apk
          
          echo "✓ APK signed"

      - name: Final Check
        run: |
          echo "========================================="
          echo "FINAL VERIFICATION"
          echo "========================================="
          
          if [ -f "signed_app.apk" ]; then
            SIZE=$(ls -lh signed_app.apk | awk '{print $5}')
            echo "✅ APK created successfully!"
            echo "📦 Size: $SIZE"
            echo "📦 Package: com.whatsapp.w4b"
          else
            echo "❌ APK not found"
            exit 1
          fi
          
          echo "========================================="

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: w4b-final-v1.0.${{ github.run_number }}
          name: "WhatsApp W4B - Final v1.0.${{ github.run_number }}"
          body: |
            ## ✅ APK Successfully Created!
            
            ### 📦 Package Information
            - **Package Name**: `com.whatsapp.w4b`
            - **Version**: v1.0.${{ github.run_number }}
            - **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            
            ### 📥 Download
            [**Download APK**](${{ github.server_url }}/${{ github.repository }}/releases/download/w4b-final-v1.0.${{ github.run_number }}/signed_app.apk)
            
            ### 📱 How to Install
            1. Download the APK
            2. Enable "Install from Unknown Sources"
            3. Install the APK
          files: |
            signed_app.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-w4b-apk
          path: signed_app.apk
          compression-level: 9
          retention-days: 90

      - name: Success Message
        run: |
          echo "========================================="
          echo "🎉 APK READY FOR DOWNLOAD! 🎉"
          echo "========================================="
          echo ""
          echo "🔗 DOWNLOAD LINK:"
          echo "${{ github.server_url }}/${{ github.repository }}/releases/download/w4b-final-v1.0.${{ github.run_number }}/signed_app.apk"
          echo ""
          echo "📦 Package: com.whatsapp.w4b"
          echo "========================================="
