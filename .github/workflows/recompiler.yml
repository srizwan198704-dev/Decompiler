name: Full Package Rename to com.whatsapp.w4b

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java & APKTool
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless zipalign wget unzip python3

          # Download and setup Android SDK tools properly
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          mkdir -p cmdline-tools
          mv latest cmdline-tools/
          
          # Set environment variables
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/build-tools/34.0.0"
          
          # Accept licenses and install build tools
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" > /dev/null 2>&1
          
          # Add to PATH
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$HOME/android-sdk/build-tools/34.0.0" >> $GITHUB_ENV
          
          # Download APKTool
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          
          apktool --version

      - name: Detect Old Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"

          if [ -f "$DECOMPILED_DIR/AndroidManifest.xml" ]; then
            OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          fi

          if [ -z "$OLD_PACKAGE" ]; then
            OLD_PACKAGE="com.whatsapp"
          fi

          echo "OLD_PACKAGE=$OLD_PACKAGE" >> $GITHUB_ENV
          echo "Detected Old Package: $OLD_PACKAGE"

      - name: Rename Package in AndroidManifest.xml ONLY
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          MANIFEST="$DECOMPILED_DIR/AndroidManifest.xml"
          NEW_PACKAGE="com.whatsapp.w4b"
          OLD_PKG="${{ env.OLD_PACKAGE }}"

          cp "$MANIFEST" "$MANIFEST.bak"

          echo "=== BEFORE (first 5 lines) ==="
          head -5 "$MANIFEST"

          # Simple sed replacement for package name
          sed -i "s/package=\"$OLD_PKG\"/package=\"$NEW_PACKAGE\"/" "$MANIFEST"
          
          # Also replace any other occurrences in the manifest
          sed -i "s/$OLD_PKG/$NEW_PACKAGE/g" "$MANIFEST"

          echo "=== AFTER (first 5 lines) ==="
          head -5 "$MANIFEST"

          echo ""
          echo "=== All com.whatsapp.w4b occurrences ==="
          grep -n "com.whatsapp.w4b" "$MANIFEST" || echo "(none found)"

      - name: Fix apktool.yml
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          APKTOOL_YML="$DECOMPILED_DIR/apktool.yml"

          if [ -f "$APKTOOL_YML" ]; then
            echo "=== apktool.yml (before) ==="
            cat "$APKTOOL_YML"

            # Update apkFileName
            sed -i "s/apkFileName: .*/apkFileName: recompiled_unsigned.apk/" "$APKTOOL_YML"
            
            # Remove problematic aapt2 lines
            sed -i "/useAapt2:/d" "$APKTOOL_YML"
            sed -i "/aapt2:/d" "$APKTOOL_YML"
            
            # Add correct flags
            echo "useAapt2: false" >> "$APKTOOL_YML"

            echo "=== apktool.yml (after) ==="
            cat "$APKTOOL_YML"
          else
            echo "⚠️ apktool.yml not found, creating minimal one..."
            cat > "$APKTOOL_YML" << 'YML'
!!brut.androlib.meta.MetaInfo
apkFileName: recompiled_unsigned.apk
compressionType: false
doNotCompress:
- arsc
isFrameworkApk: false
packageInfo:
  forcedPackageId: '127'
  renameManifestPackage: null
sdkInfo:
  minSdkVersion: '19'
  targetSdkVersion: '30'
sharedLibrary: false
sparseResources: false
useAapt2: false
versionInfo:
  versionCode: '10351'
  versionName: 4.4.3.5
YML
          fi

      - name: Recompile APK
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"

          echo "=== AndroidManifest.xml (first 15 lines) ==="
          head -15 "$DECOMPILED_DIR/AndroidManifest.xml"
          echo "============================================="

          echo "=== apktool.yml ==="
          cat "$DECOMPILED_DIR/apktool.yml" 2>/dev/null || echo "not found"
          echo "==================="

          # Try recompilation without aapt2 first (more stable)
          echo "=== Recompiling APK ==="
          if apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk -f 2>&1; then
            echo "✅ Recompilation successful!"
          else
            echo "❌ Recompilation failed"
            echo ""
            echo "=== ERROR DETAILS ==="
            apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk -f 2>&1 | tail -50
            exit 1
          fi

          if [ -f "recompiled_unsigned.apk" ] && [ -s "recompiled_unsigned.apk" ]; then
            echo ""
            echo "✅ APK created successfully!"
            ls -lh recompiled_unsigned.apk
          else
            echo "❌ APK file is empty or missing"
            exit 1
          fi

      - name: Sign APK
        run: |
          # Create keystore
          keytool -genkey -v \
            -keystore my.keystore \
            -alias w4b \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass w4b123 \
            -keypass w4b123 \
            -dname "CN=W4B, OU=Dev, O=W4B, L=Dhaka, ST=Dhaka, C=BD" \
            -noprompt

          # Align APK
          zipalign -v -p 4 recompiled_unsigned.apk aligned.apk 2>/dev/null || true

          # Sign APK
          jarsigner -keystore my.keystore \
            -storepass w4b123 \
            -keypass w4b123 \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            recompiled_unsigned.apk w4b

          mv recompiled_unsigned.apk signed_app.apk
          echo "✅ APK signed"

      - name: Verify APK
        run: |
          echo "========================================="
          echo "VERIFICATION"
          echo "========================================="

          if [ -f "signed_app.apk" ]; then
            SIZE=$(ls -lh signed_app.apk | awk '{print $5}')
            echo "✅ APK created: $SIZE"
            
            # Verify package name in manifest
            unzip -p signed_app.apk AndroidManifest.xml > /tmp/manifest.xml 2>/dev/null || true
            if grep -q "com.whatsapp.w4b" /tmp/manifest.xml 2>/dev/null; then
              echo "✅ Package name verified: com.whatsapp.w4b"
            fi
          else
            echo "❌ APK not found"
            exit 1
          fi

          echo "========================================="

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: w4b-v1.0.${{ github.run_number }}
          name: "WhatsApp W4B v1.0.${{ github.run_number }}"
          body: |
            ✅ APK Successfully Recompiled!

            **Details:**
            - Package: com.whatsapp.w4b
            - Build Number: ${{ github.run_number }}
            - Original Package: ${{ env.OLD_PACKAGE }}

            **Download:**
            Download the APK from assets below.
          files: |
            signed_app.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: w4b-apk
          path: signed_app.apk
          retention-days: 90

      - name: Show Download Link
        run: |
          echo "========================================="
          echo "🎉 SUCCESS! 🎉"
          echo "========================================="
          echo ""
          echo "📱 Download APK from:"
          echo "${{ github.server_url }}/${{ github.repository }}/releases/download/w4b-v1.0.${{ github.run_number }}/signed_app.apk"
          echo ""
          echo "📦 Or check GitHub Actions Artifacts tab"
          echo "========================================="
