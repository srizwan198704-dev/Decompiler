name: Full Package Rename to com.whatsapp.w4b

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java & APKTool
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless zipalign wget unzip

          # Install Android SDK build-tools for aapt2
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          wget -q "$CMDLINE_TOOLS_URL" -O cmdline-tools.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest

          export ANDROID_SDK_ROOT=/opt/android-sdk
          export PATH="$PATH:/opt/android-sdk/cmdline-tools/latest/bin"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0"

          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/aapt2 /usr/local/bin/aapt2
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:/opt/android-sdk/build-tools/34.0.0" >> $GITHUB_ENV

          # Download APKTool
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

          apktool --version
          aapt2 version

      - name: Detect Old Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"

          if [ -f "$DECOMPILED_DIR/AndroidManifest.xml" ]; then
            OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          fi

          if [ -z "$OLD_PACKAGE" ]; then
            OLD_PACKAGE="com.whatsapp"
          fi

          echo "OLD_PACKAGE=$OLD_PACKAGE" >> $GITHUB_ENV
          echo "Detected Old Package: $OLD_PACKAGE"

      - name: Fix and Clean AndroidManifest.xml
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          MANIFEST="$DECOMPILED_DIR/AndroidManifest.xml"

          # Create backup
          cp "$MANIFEST" "$MANIFEST.bak"

          echo "=== BEFORE (first 5 lines) ==="
          head -5 "$MANIFEST"

          # -------------------------------------------------------
          # SAFE ATTRIBUTE REMOVAL — only remove the specific
          # attributes that cause aapt2 errors. Never touch
          # "android:" namespace prefix or XML declarations.
          # -------------------------------------------------------

          # Remove split-related attributes (not standard SDK attrs)
          sed -i 's/\s*requiredSplitTypes="[^"]*"//g' "$MANIFEST"
          sed -i 's/\s*splitTypes="[^"]*"//g' "$MANIFEST"
          sed -i 's/\s*isSplitRequired="[^"]*"//g' "$MANIFEST"

          # Remove trailing whitespace only
          sed -i 's/[[:space:]]*$//' "$MANIFEST"

          # -------------------------------------------------------
          # FIX XML DECLARATION
          # Ensure there is exactly ONE <?xml ...?> at line 1,
          # nothing else before the root <manifest> tag.
          # -------------------------------------------------------

          # Remove ALL existing xml declarations first
          sed -i '/^<?xml/d' "$MANIFEST"

          # Remove any blank lines at top
          sed -i '/^[[:space:]]*$/d' "$MANIFEST"

          # Prepend clean XML declaration
          sed -i '1s/^/<?xml version="1.0" encoding="utf-8"?>\n/' "$MANIFEST"

          # -------------------------------------------------------
          # PACKAGE NAME RENAME — only rename the package attribute
          # and string occurrences of the old package name.
          # -------------------------------------------------------
          sed -i "s|package=\"${OLD_PACKAGE}\"|package=\"com.whatsapp.w4b\"|g" "$MANIFEST"
          sed -i "s|${OLD_PACKAGE}|com.whatsapp.w4b|g" "$MANIFEST"

          echo "=== AFTER (first 10 lines) ==="
          head -10 "$MANIFEST"

          # Validate XML is well-formed before continuing
          echo "=== Validating XML ==="
          if python3 -c "
          import xml.etree.ElementTree as ET
          try:
              ET.parse('$MANIFEST')
              print('✅ XML is well-formed')
          except ET.ParseError as e:
              print(f'❌ XML parse error: {e}')
              exit(1)
          "; then
            echo "✓ AndroidManifest.xml is valid"
          else
            echo "❌ AndroidManifest.xml is invalid — restoring backup"
            cp "$MANIFEST.bak" "$MANIFEST"
            # Apply ONLY the package rename on the backup (no XML touching)
            sed -i "s|package=\"${OLD_PACKAGE}\"|package=\"com.whatsapp.w4b\"|g" "$MANIFEST"
            sed -i "s|${OLD_PACKAGE}|com.whatsapp.w4b|g" "$MANIFEST"
            echo "=== Restored + renamed (first 10 lines) ==="
            head -10 "$MANIFEST"
          fi

      - name: Rename Smali Directories
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"

          OLD_PATH=$(echo "$OLD_PACKAGE" | tr '.' '/')
          NEW_PATH="com/whatsapp/w4b"

          echo "Old path: $OLD_PATH"
          echo "New path: $NEW_PATH"

          for smali_dir in $(find "$DECOMPILED_DIR" -type d -name "smali*" 2>/dev/null); do
            if [ -d "$smali_dir/$OLD_PATH" ]; then
              echo "Processing: $smali_dir"
              cd "$smali_dir"
              mkdir -p com/whatsapp
              if [ -d "$OLD_PATH" ]; then
                mv "$OLD_PATH" "com/whatsapp/w4b" 2>/dev/null || true
                echo "✓ Renamed in: $smali_dir"
              fi
              rmdir -p "$(dirname "$OLD_PATH")" 2>/dev/null || true
              cd - > /dev/null
            fi
          done

      - name: Update Smali Files Content
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD_PACKAGE_SLASH=$(echo "$OLD_PACKAGE" | tr '.' '/')
          NEW_PACKAGE_SLASH="com/whatsapp/w4b"

          echo "Updating smali files..."

          find "$DECOMPILED_DIR" -type f -name "*.smali" 2>/dev/null | while read file; do
            sed -i "s|L${OLD_PACKAGE_SLASH}/|L${NEW_PACKAGE_SLASH}/|g" "$file"
            sed -i "s|L${OLD_PACKAGE_SLASH};|L${NEW_PACKAGE_SLASH};|g" "$file"
            sed -i "s|${OLD_PACKAGE}|com.whatsapp.w4b|g" "$file"
          done

          echo "✓ Updated smali files"

      - name: Update XML and Other Files
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"

          find "$DECOMPILED_DIR" -type f -name "*.xml" ! -name "AndroidManifest.xml" 2>/dev/null | while read file; do
            sed -i "s|${OLD_PACKAGE}|com.whatsapp.w4b|g" "$file"
          done

          find "$DECOMPILED_DIR" -type f -name "*.json" 2>/dev/null | while read file; do
            sed -i "s|${OLD_PACKAGE}|com.whatsapp.w4b|g" "$file"
          done

          find "$DECOMPILED_DIR" -type f -name "*.properties" 2>/dev/null | while read file; do
            sed -i "s|${OLD_PACKAGE}|com.whatsapp.w4b|g" "$file"
          done

          echo "✓ Updated XML and configuration files"

      - name: Recompile APK
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          export PATH="$PATH:/opt/android-sdk/build-tools/34.0.0"

          echo "=== Recompiling APK ==="

          # Show manifest state before compile
          echo "--- AndroidManifest.xml (first 15 lines) ---"
          head -15 "$DECOMPILED_DIR/AndroidManifest.xml"
          echo "--------------------------------------------"

          if apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk -f --verbose 2>&1; then
            echo "✅ Recompilation successful!"
          else
            echo "❌ Recompilation failed, trying with --use-aapt2..."
            if apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk -f --use-aapt2 2>&1; then
              echo "✅ Recompilation successful with aapt2!"
            else
              echo "❌ Both recompilation attempts failed"
              exit 1
            fi
          fi

          ls -lh recompiled_unsigned.apk

      - name: Sign APK
        run: |
          export PATH="$PATH:/opt/android-sdk/build-tools/34.0.0"

          keytool -genkey -v \
            -keystore my.keystore \
            -alias w4b \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass w4b123 \
            -keypass w4b123 \
            -dname "CN=W4B, OU=Dev, O=W4B, L=Dhaka, ST=Dhaka, C=BD" \
            -noprompt

          zipalign -v -p 4 recompiled_unsigned.apk aligned.apk

          jarsigner -keystore my.keystore \
            -storepass w4b123 \
            -keypass w4b123 \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            aligned.apk w4b

          jarsigner -verify aligned.apk
          cp aligned.apk signed_app.apk
          echo "✅ APK signed and aligned"

      - name: Verify APK
        run: |
          echo "========================================="
          echo "VERIFICATION"
          echo "========================================="

          if [ -f "signed_app.apk" ]; then
            SIZE=$(ls -lh signed_app.apk | awk '{print $5}')
            echo "✅ APK created: $SIZE"
            echo "APK Contents (first 20):"
            unzip -l signed_app.apk | head -20
          else
            echo "❌ APK not found"
            exit 1
          fi

          echo "========================================="

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: w4b-v1.0.${{ github.run_number }}
          name: "WhatsApp W4B v1.0.${{ github.run_number }}"
          body: |
            ✅ APK Successfully Recompiled!

            **Details:**
            - Package: com.whatsapp.w4b
            - Build Number: ${{ github.run_number }}
            - Original Package: ${{ env.OLD_PACKAGE }}

            **Download:**
            Download the APK from assets below.

            **Verification:**
            - Successfully recompiled and signed
            - Package name changed to com.whatsapp.w4b
          files: |
            signed_app.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: w4b-apk
          path: signed_app.apk
          retention-days: 90

      - name: Show Download Link
        run: |
          echo "========================================="
          echo "🎉 SUCCESS! 🎉"
          echo "========================================="
          echo ""
          echo "📱 Download APK from:"
          echo "${{ github.server_url }}/${{ github.repository }}/releases/download/w4b-v1.0.${{ github.run_number }}/signed_app.apk"
          echo ""
          echo "📦 Or check GitHub Actions Artifacts tab"
          echo ""
          echo "🔑 Keystore Info:"
          echo "   Password: w4b123"
          echo "   Alias: w4b"
          echo "========================================="
