name: Recompile, Sign & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Recompile, Sign & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install apktool
        run: |
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          sudo mv apktool.jar /usr/local/bin/apktool.jar
          echo '#!/bin/sh' | sudo tee /usr/local/bin/apktool
          echo 'exec java -jar /usr/local/bin/apktool.jar "$@"' | sudo tee -a /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Verify decompiled_app
        run: |
          ls -la decompiled_app/
          echo "=== Checking apktool.yml ==="
          cat decompiled_app/apktool.yml | head -20
          
          echo "=== Checking AndroidManifest.xml ==="
          head -5 decompiled_app/AndroidManifest.xml

      - name: Auto-generate keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias w4b-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass W4bStore2024! \
            -keypass W4bKey2024! \
            -dname "CN=WhatsApp W4B, OU=Dev, O=W4B, L=Dhaka, ST=Dhaka, C=BD"

      - name: Modify package name
        run: |
          # Get original package
          ORIGINAL_PKG=$(grep -oP 'package="\K[^"]+' decompiled_app/AndroidManifest.xml | head -1)
          echo "Original: $ORIGINAL_PKG"
          NEW_PKG="com.whatsapp.w4b"
          
          # Replace in AndroidManifest
          sed -i "s|package=\"${ORIGINAL_PKG}\"|package=\"${NEW_PKG}\"|g" decompiled_app/AndroidManifest.xml
          sed -i "s|${ORIGINAL_PKG}|${NEW_PKG}|g" decompiled_app/AndroidManifest.xml
          
          # Update apktool.yml
          sed -i '/renameManifestPackage:/d' decompiled_app/apktool.yml
          echo "renameManifestPackage: ${NEW_PKG}" >> decompiled_app/apktool.yml
          
          echo "✅ Package changed to: $NEW_PKG"

      - name: Fix resource issues (CRITICAL)
        run: |
          # Method 1: Remove resources.arsc
          if [ -f "decompiled_app/resources.arsc" ]; then
            rm -f decompiled_app/resources.arsc
            echo "Removed resources.arsc - will be regenerated"
          fi
          
          # Method 2: Clean raw folder
          if [ -d "decompiled_app/res/raw" ]; then
            rm -rf decompiled_app/res/raw
            echo "Removed raw folder - common issue"
          fi
          
          # Method 3: Remove problematic PNGs
          find decompiled_app/res -name "*.9.png" -exec rm -f {} \;
          
          # Method 4: Remove values issues
          find decompiled_app/res/values -type f -name "*.xml" -exec sed -i '/<eat-comment>/d' {} \;

      - name: Recompile (Simple method)
        run: |
          # Try simplest recompile first
          apktool b decompiled_app -o output_unsigned.apk -f 2>&1 | tee build.log
          
          if [ ! -f "output_unsigned.apk" ]; then
            echo "Failed, trying with --use-aapt1..."
            apktool b decompiled_app -o output_unsigned.apk --use-aapt1 -f 2>&1 | tee build.log
          fi
          
          if [ ! -f "output_unsigned.apk" ]; then
            echo "Still failed, trying without resources..."
            apktool b decompiled_app -o output_unsigned.apk --no-res -f
          fi
          
          # Check if successful
          if [ -f "output_unsigned.apk" ] && [ -s "output_unsigned.apk" ]; then
            echo "✅ Recompilation successful!"
            ls -lh output_unsigned.apk
          else
            echo "❌ All recompilation attempts failed"
            echo "=== Last error ==="
            tail -30 build.log
            exit 1
          fi

      - name: Sign APK
        run: |
          jarsigner -verbose \
            -keystore release.keystore \
            -storepass W4bStore2024! \
            -keypass W4bKey2024! \
            -sigalg SHA1withRSA \
            -digestalg SHA1 \
            output_unsigned.apk w4b-key
          
          mv output_unsigned.apk output_signed.apk
          echo "✅ Signed successfully"

      - name: Finalize
        run: |
          TAG="${{ github.ref_name }}"
          [ -z "$TAG" ] && TAG="build-${{ github.run_number }}"
          FINAL_NAME="whatsapp-w4b-${TAG}.apk"
          mv output_signed.apk "$FINAL_NAME"
          echo "APK_NAME=$FINAL_NAME" >> $GITHUB_ENV
          echo "✅ APK ready: $FINAL_NAME"
          ls -lh "$FINAL_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-w4b-apk
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.APK_NAME }}
          name: "WhatsApp W4B ${{ github.ref_name }}"
          body: "Build #${{ github.run_number }}\nPackage: com.whatsapp.w4b"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: rm -f release.keystore output_unsigned.apk build.log
