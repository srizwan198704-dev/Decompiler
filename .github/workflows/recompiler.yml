name: Full Package Rename to com.whatsapp.w4b

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java & APKTool
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre-headless
          
          # Download APKTool
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          
          apktool --version

      - name: Detect Old Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Get package from AndroidManifest
          OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          
          # If not found, try to find from smali directories
          if [ -z "$OLD_PACKAGE" ]; then
            OLD_PACKAGE=$(find "$DECOMPILED_DIR/smali" -type d -name "com" -exec find {} -type d -name "whatsapp" \; | head -1 | sed 's|'$DECOMPILED_DIR'/smali/||' | tr '/' '.')
          fi
          
          # Extract the base package (everything before the last dot if there are more than 3 parts)
          BASE_PACKAGE=$(echo "$OLD_PACKAGE" | cut -d'.' -f1-3)
          
          echo "OLD_PACKAGE=$OLD_PACKAGE" >> $GITHUB_ENV
          echo "BASE_PACKAGE=$BASE_PACKAGE" >> $GITHUB_ENV
          echo "NEW_PACKAGE=com.whatsapp.w4b" >> $GITHUB_ENV
          
          echo "Detected Old Package: $OLD_PACKAGE"
          echo "Base Package: $BASE_PACKAGE"
          echo "New Package: com.whatsapp.w4b"

      - name: Update AndroidManifest.xml
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update main package
          sed -i "s/package=\"$OLD_PACKAGE\"/package=\"com.whatsapp.w4b\"/" "$DECOMPILED_DIR/AndroidManifest.xml"
          
          # Update all package references in manifest (provider, activity, service, receiver)
          sed -i "s/$OLD_PACKAGE/com.whatsapp.w4b/g" "$DECOMPILED_DIR/AndroidManifest.xml"
          
          echo "✓ AndroidManifest.xml updated"
          cat "$DECOMPILED_DIR/AndroidManifest.xml" | grep -E "package=|provider|activity|service" | head -10

      - name: Rename All Directory Structures
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Convert package names to path format
          OLD_PATH=$(echo "$OLD_PACKAGE" | tr '.' '/')
          BASE_PATH=$(echo "$BASE_PACKAGE" | tr '.' '/')
          NEW_PATH="com/whatsapp/w4b"
          
          echo "Old path: $OLD_PATH"
          echo "Base path: $BASE_PATH"
          echo "New path: $NEW_PATH"
          
          # Find and rename directories in all smali folders (smali, smali_classes2, etc.)
          find "$DECOMPILED_DIR" -type d -name "smali*" | while read smali_dir; do
            echo "Processing: $smali_dir"
            
            cd "$smali_dir"
            
            # Check and rename full package path
            if [ -d "$OLD_PATH" ]; then
              mkdir -p "$(dirname "$NEW_PATH")"
              mv "$OLD_PATH" "$NEW_PATH" 2>/dev/null || echo "Already moved"
              echo "  ✓ Renamed full package: $OLD_PATH -> $NEW_PATH"
            fi
            
            # Check and rename base package path (if different)
            if [ "$BASE_PATH" != "$OLD_PATH" ] && [ -d "$BASE_PATH" ]; then
              mkdir -p "$(dirname "$NEW_PATH")"
              # Need to carefully rename only the base part
              if [ -d "$BASE_PATH" ]; then
                find "$BASE_PATH" -type d -name "*" | while read old_subpath; do
                  new_subpath=$(echo "$old_subpath" | sed "s|$BASE_PATH|$NEW_PATH|")
                  if [ "$old_subpath" != "$new_subpath" ] && [ ! -d "$new_subpath" ]; then
                    mkdir -p "$(dirname "$new_subpath")"
                    mv "$old_subpath" "$new_subpath" 2>/dev/null || true
                  fi
                done
                echo "  ✓ Renamed base package structure"
              fi
            fi
            
            cd - > /dev/null
          done

      - name: Update All Smali Files (Complete Package References)
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update in all smali files - Class references
          find "$DECOMPILED_DIR" -type f -name "*.smali" | while read file; do
            # Update class declarations (Lpackage/Class;)
            sed -i "s|L$OLD_PACKAGE/|Lcom/whatsapp/w4b/|g" "$file"
            sed -i "s|L$BASE_PACKAGE/|Lcom/whatsapp/w4b/|g" "$file"
            
            # Update invoke-virtual and other method calls
            sed -i "s|$OLD_PACKAGE|com.whatsapp.w4b|g" "$file"
            sed -i "s|$BASE_PACKAGE|com.whatsapp.w4b|g" "$file"
            
            # Update const-string values that might contain package name
            sed -i "s|\"$OLD_PACKAGE\"|\"com.whatsapp.w4b\"|g" "$file"
            sed -i "s|\"$BASE_PACKAGE\"|\"com.whatsapp.w4b\"|g" "$file"
          done
          
          echo "✓ Updated all smali files"

      - name: Update All XML Files (Resources, Layouts, etc.)
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update all XML files
          find "$DECOMPILED_DIR" -type f -name "*.xml" | while read file; do
            sed -i "s|$OLD_PACKAGE|com.whatsapp.w4b|g" "$file"
            sed -i "s|$BASE_PACKAGE|com.whatsapp.w4b|g" "$file"
          done
          
          echo "✓ Updated all XML files"

      - name: Update Public Resources IDs (If exists)
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # Update public.xml if it exists (for resources)
          if [ -f "$DECOMPILED_DIR/res/values/public.xml" ]; then
            sed -i "s|$OLD_PACKAGE|com.whatsapp.w4b|g" "$DECOMPILED_DIR/res/values/public.xml"
            echo "✓ Updated public.xml"
          fi
          
          # Update any .json files
          find "$DECOMPILED_DIR" -type f -name "*.json" -exec sed -i "s|$OLD_PACKAGE|com.whatsapp.w4b|g" {} \;
          find "$DECOMPILED_DIR" -type f -name "*.json" -exec sed -i "s|$BASE_PACKAGE|com.whatsapp.w4b|g" {} \;

      - name: Update Smali File Names (Inner Classes)
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          NEW_PATH_DIR="com/whatsapp/w4b"
          
          # Find and rename any remaining files with old package in filename
          find "$DECOMPILED_DIR" -type f -name "*.smali" | while read file; do
            # Check if file path contains old package
            if echo "$file" | grep -q "$BASE_PACKAGE"; then
              new_file=$(echo "$file" | sed "s|$BASE_PACKAGE|$NEW_PATH_DIR|g")
              if [ "$file" != "$new_file" ]; then
                mkdir -p "$(dirname "$new_file")"
                mv "$file" "$new_file" 2>/dev/null || true
                echo "  ✓ Renamed file: $(basename $file)"
              fi
            fi
          done

      - name: Recompile APK
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          
          echo "=== Recompiling APK ==="
          echo "This may take a few minutes..."
          
          apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk
          
          if [ ! -f "recompiled_unsigned.apk" ] || [ ! -s "recompiled_unsigned.apk" ]; then
            echo "❌ Recompilation failed!"
            exit 1
          fi
          
          echo "✅ Recompilation successful!"
          ls -lh recompiled_unsigned.apk

      - name: Generate Keystore and Sign APK
        run: |
          # Create keystore
          keytool -genkey -v \
            -keystore w4b-keystore.jks \
            -alias w4b \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass w4b123 \
            -keypass w4b123 \
            -dname "CN=W4B, OU=Dev, O=W4B, L=Dhaka, ST=Dhaka, C=BD" \
            -noprompt
          
          echo "✓ Keystore created"
          
          # Sign APK
          jarsigner -verbose \
            -sigalg SHA1withRSA \
            -digestalg SHA1 \
            -keystore w4b-keystore.jks \
            -storepass w4b123 \
            -keypass w4b123 \
            recompiled_unsigned.apk w4b
          
          echo "✓ APK signed"
          
          # Verify
          jarsigner -verify recompiled_unsigned.apk
          
          cp recompiled_unsigned.apk signed_app.apk

      - name: Final Verification
        run: |
          echo "========================================="
          echo "FINAL VERIFICATION"
          echo "========================================="
          
          # Extract and verify package name
          unzip -q signed_app.apk -d verify_temp
          
          if [ -f "verify_temp/AndroidManifest.xml" ]; then
            FINAL_PACKAGE=$(grep -oP 'package="\K[^"]+' verify_temp/AndroidManifest.xml)
            echo "📦 Package in APK: $FINAL_PACKAGE"
            
            if [ "$FINAL_PACKAGE" == "com.whatsapp.w4b" ]; then
              echo "✅ SUCCESS! Package renamed to com.whatsapp.w4b"
            else
              echo "⚠️ Package is: $FINAL_PACKAGE"
            fi
          fi
          
          # Check smali directory structure
          if unzip -l signed_app.apk | grep -q "smali/com/whatsapp/w4b"; then
            echo "✅ Smali directories correctly renamed"
          fi
          
          rm -rf verify_temp

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: w4b-v1.0.${{ github.run_number }}
          name: "WhatsApp W4B - Renamed Package"
          body: |
            ## ✅ SUCCESSFULLY RENAMED PACKAGE TO `com.whatsapp.w4b`
            
            ### 🔄 Changes Made:
            - **Old Package**: `${{ env.OLD_PACKAGE }}`
            - **New Package**: `com.whatsapp.w4b`
            - Renamed all directory structures
            - Updated all smali files (class references, method calls)
            - Updated all XML files (layouts, manifests, resources)
            - Recompiled and signed successfully
            
            ### 📥 Download
            [**Download APK**](${{ github.server_url }}/${{ github.repository }}/releases/download/w4b-v1.0.${{ github.run_number }}/signed_app.apk)
            
            ### 📊 Build Info
            - **Build Number**: ${{ github.run_number }}
            - **Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            - **File Size**: $(ls -lh signed_app.apk | awk '{print $5}')
            
            ### 📱 Installation
            1. Download the APK
            2. Enable "Unknown Sources" in Settings
            3. Install the APK
          files: |
            signed_app.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: w4b-renamed-apk
          path: signed_app.apk
          compression-level: 9
          retention-days: 90

      - name: Show Download Link
        run: |
          echo "========================================="
          echo "🎉 APK READY FOR DOWNLOAD! 🎉"
          echo "========================================="
          echo ""
          echo "🔗 DOWNLOAD LINK:"
          echo "${{ github.server_url }}/${{ github.repository }}/releases/download/w4b-v1.0.${{ github.run_number }}/signed_app.apk"
          echo ""
          echo "📦 Package: com.whatsapp.w4b"
          echo "========================================="
