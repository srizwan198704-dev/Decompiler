name: Full Package Rename to com.whatsapp.w4b

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java & APKTool
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless zipalign wget unzip

          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          wget -q "$CMDLINE_TOOLS_URL" -O cmdline-tools.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest

          export ANDROID_SDK_ROOT=/opt/android-sdk
          export PATH="$PATH:/opt/android-sdk/cmdline-tools/latest/bin"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0"

          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/aapt2 /usr/local/bin/aapt2
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:/opt/android-sdk/build-tools/34.0.0" >> $GITHUB_ENV

          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

          apktool --version
          aapt2 version

      - name: Detect Old Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"

          if [ -f "$DECOMPILED_DIR/AndroidManifest.xml" ]; then
            OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          fi

          if [ -z "$OLD_PACKAGE" ]; then
            OLD_PACKAGE="com.whatsapp"
          fi

          echo "OLD_PACKAGE=$OLD_PACKAGE" >> $GITHUB_ENV
          echo "Detected Old Package: $OLD_PACKAGE"

      - name: Rename Package in AndroidManifest.xml ONLY
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          MANIFEST="$DECOMPILED_DIR/AndroidManifest.xml"
          NEW_PACKAGE="com.whatsapp.w4b"
          OLD_PKG="${{ env.OLD_PACKAGE }}"

          cp "$MANIFEST" "$MANIFEST.bak"

          echo "=== BEFORE (first 5 lines) ==="
          head -5 "$MANIFEST"

          cat > /tmp/rename_pkg.py << EOF
import re, sys

manifest_path = "$MANIFEST"
old = "$OLD_PKG"
new = "$NEW_PACKAGE"

with open(manifest_path, "r", encoding="utf-8") as f:
    content = f.read()

escaped_old = re.escape(old)

if new.startswith(old):
    extra_suffix = re.escape(new[len(old):])
    pattern = escaped_old + r'(?!' + extra_suffix + r')'
else:
    pattern = escaped_old

new_content = re.sub(pattern, new, content)

count = len(re.findall(pattern, content))
print(f"Replaced {count} occurrence(s) of '{old}' -> '{new}'")

with open(manifest_path, "w", encoding="utf-8") as f:
    f.write(new_content)

import xml.etree.ElementTree as ET
try:
    ET.parse(manifest_path)
    print("✅ XML is well-formed")
except ET.ParseError as e:
    print(f"❌ XML parse error: {e}")
    sys.exit(1)
EOF

          python3 /tmp/rename_pkg.py

          echo "=== AFTER (first 5 lines) ==="
          head -5 "$MANIFEST"

          echo ""
          echo "=== All com.whatsapp.w4b occurrences ==="
          grep -n "com.whatsapp.w4b" "$MANIFEST" || echo "(none found)"

      - name: Fix apktool.yml
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          APKTOOL_YML="$DECOMPILED_DIR/apktool.yml"

          if [ -f "$APKTOOL_YML" ]; then
            echo "=== apktool.yml (before) ==="
            cat "$APKTOOL_YML"

            # unknownFiles বা aapt2 সংক্রান্ত সমস্যা এড়াতে
            # versionInfo ঠিক রেখে শুধু compressionType ঠিক করা হচ্ছে
            # apkFileName rename করা হচ্ছে
            sed -i "s/apkFileName: .*/apkFileName: recompiled_unsigned.apk/" "$APKTOOL_YML"

            # aapt2 force করা
            if grep -q "useAapt2:" "$APKTOOL_YML"; then
              sed -i "s/useAapt2: .*/useAapt2: true/" "$APKTOOL_YML"
            else
              echo "useAapt2: true" >> "$APKTOOL_YML"
            fi

            echo "=== apktool.yml (after) ==="
            cat "$APKTOOL_YML"
          else
            echo "⚠️ apktool.yml not found, creating minimal one..."
            cat > "$APKTOOL_YML" << 'YML'
!!brut.androlib.meta.MetaInfo
apkFileName: recompiled_unsigned.apk
compressionType: false
doNotCompress:
- arsc
isFrameworkApk: false
packageInfo:
  forcedPackageId: '127'
  renameManifestPackage: null
sdkInfo:
  minSdkVersion: '19'
  targetSdkVersion: '30'
sharedLibrary: false
sparseResources: false
useAapt2: true
versionInfo:
  versionCode: '1'
  versionName: 1.0
YML
          fi

      - name: Recompile APK
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          export PATH="$PATH:/opt/android-sdk/build-tools/34.0.0"

          echo "=== AndroidManifest.xml (first 15 lines) ==="
          head -15 "$DECOMPILED_DIR/AndroidManifest.xml"
          echo "============================================="

          echo "=== apktool.yml ==="
          cat "$DECOMPILED_DIR/apktool.yml" 2>/dev/null || echo "not found"
          echo "==================="

          echo "=== Attempt 1: default ==="
          if apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk -f 2>&1; then
            echo "✅ Success!"
          else
            echo "=== Attempt 2: --use-aapt2 ==="
            if apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk -f --use-aapt2 2>&1; then
              echo "✅ Success with --use-aapt2!"
            else
              echo "=== Attempt 3: --no-crunch ==="
              if apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk -f --use-aapt2 --no-crunch 2>&1; then
                echo "✅ Success with --no-crunch!"
              else
                echo "❌ All attempts failed"
                echo ""
                echo "=== FULL ERROR LOG ==="
                apktool b "$DECOMPILED_DIR" -o recompiled_unsigned.apk -f --use-aapt2 2>&1 | tail -50
                exit 1
              fi
            fi
          fi

          ls -lh recompiled_unsigned.apk

      - name: Sign APK
        run: |
          export PATH="$PATH:/opt/android-sdk/build-tools/34.0.0"

          keytool -genkey -v \
            -keystore my.keystore \
            -alias w4b \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass w4b123 \
            -keypass w4b123 \
            -dname "CN=W4B, OU=Dev, O=W4B, L=Dhaka, ST=Dhaka, C=BD" \
            -noprompt

          zipalign -v -p 4 recompiled_unsigned.apk aligned.apk

          jarsigner -keystore my.keystore \
            -storepass w4b123 \
            -keypass w4b123 \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            aligned.apk w4b

          jarsigner -verify aligned.apk
          cp aligned.apk signed_app.apk
          echo "✅ APK signed and aligned"

      - name: Verify APK
        run: |
          echo "========================================="
          echo "VERIFICATION"
          echo "========================================="

          if [ -f "signed_app.apk" ]; then
            SIZE=$(ls -lh signed_app.apk | awk '{print $5}')
            echo "✅ APK created: $SIZE"
            echo ""
            echo "APK Contents (first 20):"
            unzip -l signed_app.apk | head -20
          else
            echo "❌ APK not found"
            exit 1
          fi

          echo "========================================="

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: w4b-v1.0.${{ github.run_number }}
          name: "WhatsApp W4B v1.0.${{ github.run_number }}"
          body: |
            ✅ APK Successfully Recompiled!

            **Details:**
            - Package: com.whatsapp.w4b
            - Build Number: ${{ github.run_number }}
            - Original Package: ${{ env.OLD_PACKAGE }}

            **Download:**
            Download the APK from assets below.

            **Verification:**
            - Successfully recompiled and signed
            - Package name changed to com.whatsapp.w4b
          files: |
            signed_app.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: w4b-apk
          path: signed_app.apk
          retention-days: 90

      - name: Show Download Link
        run: |
          echo "========================================="
          echo "🎉 SUCCESS! 🎉"
          echo "========================================="
          echo ""
          echo "📱 Download APK from:"
          echo "${{ github.server_url }}/${{ github.repository }}/releases/download/w4b-v1.0.${{ github.run_number }}/signed_app.apk"
          echo ""
          echo "📦 Or check GitHub Actions Artifacts tab"
          echo ""
          echo "🔑 Keystore Info:"
          echo "   Password: w4b123"
          echo "   Alias: w4b"
          echo "========================================="
