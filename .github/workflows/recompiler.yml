name: Build, Sign & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Recompile, Sign & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install apktool
        run: |
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar \
            -O /usr/local/bin/apktool.jar
          echo '#!/bin/sh' | sudo tee /usr/local/bin/apktool > /dev/null
          echo 'exec java -jar /usr/local/bin/apktool.jar "$@"' \
            | sudo tee -a /usr/local/bin/apktool > /dev/null
          sudo chmod +x /usr/local/bin/apktool

      - name: Auto-generate keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias w4b-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass W4bStore2024! \
            -keypass W4bKey2024! \
            -dname "CN=WhatsApp W4B, OU=Dev, O=W4B, L=Dhaka, ST=Dhaka, C=BD"
          echo "Keystore generated successfully"
          keytool -list -v -keystore release.keystore \
            -storepass W4bStore2024! | grep -E "Alias|Valid|SHA"

      - name: Replace package name in AndroidManifest.xml
        run: |
          MANIFEST="decompiled_app/AndroidManifest.xml"
          ORIGINAL_PKG=$(grep -oP 'package="\K[^"]+' "$MANIFEST" | head -1)
          echo "Original package: $ORIGINAL_PKG"
          NEW_PKG="com.whatsapp.w4b"

          sed -i "s|${ORIGINAL_PKG}|${NEW_PKG}|g" "$MANIFEST"

          echo "=== Verification ==="
          grep -n "package=" "$MANIFEST"
          echo "=== Old package remaining ==="
          grep -c "$ORIGINAL_PKG" "$MANIFEST" || echo "0 — clean!"

      - name: Update apktool.yml
        run: |
          APKTOOL_YML="decompiled_app/apktool.yml"
          if [ -f "$APKTOOL_YML" ]; then
            sed -i "s|renameManifestPackage:.*|renameManifestPackage: com.whatsapp.w4b|" \
              "$APKTOOL_YML"
            echo "apktool.yml updated:"
            cat "$APKTOOL_YML"
          else
            echo "apktool.yml not found, skipping"
          fi

      - name: Recompile with apktool
        run: |
          apktool b decompiled_app \
            --output output_unsigned.apk \
            --use-aapt2 \
            -f

      - name: Zipalign APK
        run: |
          ZIPALIGN=$(find $ANDROID_HOME -name "zipalign" | sort -r | head -1)
          echo "Using zipalign: $ZIPALIGN"
          "$ZIPALIGN" -v -p 4 output_unsigned.apk output_aligned.apk

      - name: Sign APK with apksigner
        run: |
          APKSIGNER=$(find $ANDROID_HOME -name "apksigner" | sort -r | head -1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias w4b-key \
            --ks-pass pass:W4bStore2024! \
            --key-pass pass:W4bKey2024! \
            --out output_signed.apk \
            output_aligned.apk

          echo "=== Signature Verification ==="
          "$APKSIGNER" verify --verbose output_signed.apk

      - name: Rename final APK
        run: |
          TAG="${{ github.ref_name }}"
          # workflow_dispatch হলে tag নাও, নইলে commit sha ব্যবহার করো
          if [ "$TAG" = "" ] || [ "$TAG" = "refs/heads/main" ]; then
            TAG="build-${{ github.run_number }}"
          fi
          FINAL_NAME="whatsapp-w4b-${TAG}.apk"
          mv output_signed.apk "$FINAL_NAME"
          echo "APK_NAME=$FINAL_NAME" >> $GITHUB_ENV
          echo "Final APK: $FINAL_NAME"
          ls -lh "$FINAL_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-w4b-apk
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.APK_NAME }}
          name: "WhatsApp W4B ${{ github.ref_name }}"
          body: |
            ## WhatsApp Business W4B ${{ github.ref_name }}

            **Package:** `com.whatsapp.w4b`
            **Build:** #${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ### What changed
            - Package name → `com.whatsapp.w4b`
            - Recompiled with apktool 2.9.3
            - Auto-signed with generated keystore
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f release.keystore
          rm -f output_unsigned.apk
          rm -f output_aligned.apk
          echo "Cleanup done"
