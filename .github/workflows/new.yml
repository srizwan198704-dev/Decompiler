name: Complete APK Recompile with Package Rename

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Original APK Google Drive or Dropbox Link'
        required: true
        default: 'https://www.dropbox.com/scl/fi/m0o5dientxi4bj0170n3v/ES_File_Explorer_v4.apk?rlkey=kw4hh09pq6z7ieozmwhz1cwt&st=sytcmpjo&dl=1'

jobs:
  decompile-rename-recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless python3-pip wget curl
          pip install gdown
          
          # Download APKTool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O /usr/local/bin/apktool.jar
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          
          apktool --version

      - name: Download Original APK (Fixed)
        run: |
          URL="${{ github.event.inputs.apk_url }}"
          
          # Handle different URL types
          if [[ "$URL" == *"dropbox.com"* ]]; then
            # Extract dropbox file ID and use direct download
            echo "Downloading from Dropbox..."
            
            # Convert to raw download link
            RAW_URL=$(echo "$URL" | sed 's/?dl=0/?dl=1/' | sed 's/?dl=1/?dl=1/')
            RAW_URL=$(echo "$RAW_URL" | sed 's/www.dropbox.com/dl.dropboxusercontent.com/')
            
            # Try different methods
            wget -O original.apk "$RAW_URL" --no-check-certificate || \
            curl -L -o original.apk "$RAW_URL" || \
            wget -O original.apk "https://dl.dropboxusercontent.com/s/$(echo $URL | grep -oP 'scl/fi/\K[^?]+')" --no-check-certificate
            
          elif [[ "$URL" == *"drive.google.com"* ]]; then
            echo "Downloading from Google Drive..."
            gdown "$URL" -O original.apk --fuzzy
          else
            echo "Downloading from direct URL..."
            wget -O original.apk "$URL" --no-check-certificate
          fi
          
          # Verify download
          if [ ! -f "original.apk" ]; then
            echo "❌ Failed to download APK"
            exit 1
          fi
          
          # Check if it's a valid APK
          if file original.apk | grep -q "zip"; then
            echo "✓ APK downloaded and verified"
            ls -lh original.apk
          else
            echo "❌ Downloaded file is not a valid APK"
            file original.apk
            exit 1
          fi

      - name: Alternative Download Method (if needed)
        if: failure()
        run: |
          echo "Trying alternative download method..."
          URL="${{ github.event.inputs.apk_url }}"
          
          # Use curl with follow redirects
          curl -L -o original.apk "$URL" -H "User-Agent: Mozilla/5.0"
          
          # Check if file is HTML (redirect page)
          if file original.apk | grep -q "HTML"; then
            echo "Got HTML instead of APK. Extracting real URL..."
            grep -oP 'https://[^"]+\.apk' original.apk | head -1 > real_url.txt
            if [ -s real_url.txt ]; then
              REAL_URL=$(cat real_url.txt)
              curl -L -o original.apk "$REAL_URL"
            fi
          fi
          
          ls -lh original.apk
          file original.apk

      - name: Verify APK Integrity
        run: |
          # Check if it's a valid zip/APK
          if unzip -t original.apk 2>&1 | grep -q "No errors"; then
            echo "✅ APK is valid"
          else
            echo "⚠️ APK may be corrupted, but continuing..."
            # Try to fix with zip -F
            zip -FF original.apk --out fixed.apk 2>/dev/null || true
            if [ -f "fixed.apk" ]; then
              mv fixed.apk original.apk
            fi
          fi

      - name: Decompile APK
        run: |
          # Try decompile with force
          apktool d original.apk -o decompiled -f
          
          if [ ! -d "decompiled" ]; then
            echo "❌ Decompilation failed"
            exit 1
          fi
          
          echo "✓ Decompiled successfully"
          ls -la decompiled/

      - name: Get Original Package Name
        run: |
          if [ -f "decompiled/AndroidManifest.xml" ]; then
            ORIGINAL_PACKAGE=$(grep -oP 'package="\K[^"]+' decompiled/AndroidManifest.xml | head -1)
            echo "ORIGINAL_PACKAGE=$ORIGINAL_PACKAGE" >> $GITHUB_ENV
            echo "Original package: $ORIGINAL_PACKAGE"
          else
            echo "❌ AndroidManifest.xml not found"
            exit 1
          fi

      - name: Clean and Update AndroidManifest.xml
        run: |
          # Remove problematic attributes
          sed -i 's/requiredSplitTypes="[^"]*"//g' decompiled/AndroidManifest.xml
          sed -i 's/splitTypes="[^"]*"//g' decompiled/AndroidManifest.xml
          sed -i 's/isSplitRequired="[^"]*"//g' decompiled/AndroidManifest.xml
          sed -i 's/android:extractNativeLibs="[^"]*"//g' decompiled/AndroidManifest.xml
          
          # Update package name
          sed -i "s/package=\"$ORIGINAL_PACKAGE\"/package=\"com.whatsapp.w4b\"/" decompiled/AndroidManifest.xml
          sed -i "s/$ORIGINAL_PACKAGE/com.whatsapp.w4b/g" decompiled/AndroidManifest.xml
          
          echo "✓ AndroidManifest.xml updated"

      - name: Rename Smali Directories
        run: |
          OLD_PATH=$(echo "$ORIGINAL_PACKAGE" | tr '.' '/')
          NEW_PATH="com/whatsapp/w4b"
          
          for smali_dir in decompiled/smali*; do
            if [ -d "$smali_dir" ] && [ -d "$smali_dir/$OLD_PATH" ]; then
              cd "$smali_dir"
              mkdir -p com/whatsapp
              mv "$OLD_PATH" "com/whatsapp/w4b" 2>/dev/null || true
              cd - > /dev/null
              echo "✓ Renamed in $(basename $smali_dir)"
            fi
          done

      - name: Update All Files
        run: |
          find decompiled -name "*.smali" -type f | while read file; do
            sed -i "s|L$ORIGINAL_PACKAGE/|Lcom/whatsapp/w4b/|g" "$file"
            sed -i "s|$ORIGINAL_PACKAGE|com.whatsapp.w4b|g" "$file"
          done
          
          find decompiled -name "*.xml" -type f | while read file; do
            sed -i "s|$ORIGINAL_PACKAGE|com.whatsapp.w4b|g" "$file"
          done
          
          echo "✓ All files updated"

      - name: Recompile APK
        id: recompile
        run: |
          apktool b decompiled -o unsigned.apk -f
          
          if [ -f "unsigned.apk" ] && [ -s "unsigned.apk" ]; then
            SIZE=$(ls -lh unsigned.apk | awk '{print $5}')
            echo "✅ Recompiled! Size: $SIZE"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Recompile failed"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Sign APK
        if: steps.recompile.outputs.status == 'success'
        run: |
          keytool -genkey -v \
            -keystore my-release-key.jks \
            -alias w4b \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass w4b123 \
            -keypass w4b123 \
            -dname "CN=WhatsApp W4B, OU=Dev, O=W4B, L=Dhaka, ST=Dhaka, C=BD" \
            -noprompt
          
          jarsigner -verbose \
            -keystore my-release-key.jks \
            -storepass w4b123 \
            -keypass w4b123 \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            unsigned.apk w4b
          
          cp unsigned.apk com.whatsapp.w4b.apk
          echo "✓ APK signed"

      - name: Create GitHub Release
        if: steps.recompile.outputs.status == 'success'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: w4b-v${{ github.run_number }}
          name: "WhatsApp W4B v${{ github.run_number }}"
          body: |
            ## ✅ APK Successfully Modified!
            
            - **New Package**: `com.whatsapp.w4b`
            - **Original**: `${{ env.ORIGINAL_PACKAGE }}`
            
            [Download APK](${{ github.server_url }}/${{ github.repository }}/releases/download/w4b-v${{ github.run_number }}/com.whatsapp.w4b.apk)
          files: |
            com.whatsapp.w4b.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        if: steps.recompile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-w4b
          path: com.whatsapp.w4b.apk
          retention-days: 90

      - name: Success Message
        if: steps.recompile.outputs.status == 'success'
        run: |
          echo "========================================="
          echo "✅ APK READY!"
          echo "========================================="
          echo "Download: ${{ github.server_url }}/${{ github.repository }}/releases/download/w4b-v${{ github.run_number }}/com.whatsapp.w4b.apk"
          echo "========================================="
