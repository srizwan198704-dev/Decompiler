name: Complete APK Recompile with Package Rename

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Original APK Google Drive or Dropbox Link'
        required: true
        default: 'https://www.dropbox.com/scl/fi/m0o5dientxi4bj0170n3v/ES_File_Explorer_v4.apk?rlkey=kw4hh09pq6z7ieozmwhz1cwt&st=sytcmpjo&dl=1'

jobs:
  decompile-rename-recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless python3-pip wget
          pip install gdown
          
          # Download APKTool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O /usr/local/bin/apktool.jar
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          
          apktool --version

      - name: Download Original APK
        run: |
          URL="${{ github.event.inputs.apk_url }}"
          
          # Handle Dropbox links
          if [[ "$URL" == *"dropbox.com"* ]]; then
            # Convert dropbox link to direct download
            DIRECT_URL=$(echo "$URL" | sed 's/dl=0/dl=1/')
            wget -O original.apk "$DIRECT_URL" --no-check-certificate
          else
            # For Google Drive or other links
            gdown "$URL" -O original.apk
          fi
          
          echo "✓ APK downloaded"
          ls -lh original.apk

      - name: Decompile APK (Fresh)
        run: |
          # Fresh decompile
          apktool d original.apk -o decompiled -f
          echo "✓ Decompiled successfully"

      - name: Get Original Package Name
        run: |
          ORIGINAL_PACKAGE=$(grep -oP 'package="\K[^"]+' decompiled/AndroidManifest.xml | head -1)
          echo "ORIGINAL_PACKAGE=$ORIGINAL_PACKAGE" >> $GITHUB_ENV
          echo "Original package: $ORIGINAL_PACKAGE"

      - name: Fix AndroidManifest.xml
        run: |
          # Create a clean manifest
          cp decompiled/AndroidManifest.xml decompiled/AndroidManifest.xml.bak
          
          # Remove problematic attributes
          sed -i 's/requiredSplitTypes="[^"]*"//g' decompiled/AndroidManifest.xml
          sed -i 's/splitTypes="[^"]*"//g' decompiled/AndroidManifest.xml
          sed -i 's/isSplitRequired="[^"]*"//g' decompiled/AndroidManifest.xml
          sed -i 's/android:extractNativeLibs="[^"]*"//g' decompiled/AndroidManifest.xml
          sed -i 's/android:useEmbeddedDex="[^"]*"//g' decompiled/AndroidManifest.xml
          
          # Change package name
          sed -i "s/package=\"$ORIGINAL_PACKAGE\"/package=\"com.whatsapp.w4b\"/" decompiled/AndroidManifest.xml
          sed -i "s/$ORIGINAL_PACKAGE/com.whatsapp.w4b/g" decompiled/AndroidManifest.xml
          
          echo "✓ AndroidManifest.xml fixed"

      - name: Rename Smali Directories
        run: |
          OLD_PATH=$(echo "$ORIGINAL_PACKAGE" | tr '.' '/')
          NEW_PATH="com/whatsapp/w4b"
          
          # Rename in all smali directories
          for smali in decompiled/smali*; do
            if [ -d "$smali" ] && [ -d "$smali/$OLD_PATH" ]; then
              cd "$smali"
              mkdir -p com/whatsapp
              mv "$OLD_PATH" "com/whatsapp/w4b" 2>/dev/null || true
              cd - > /dev/null
              echo "✓ Renamed in $(basename $smali)"
            fi
          done

      - name: Update All Files
        run: |
          # Update smali files
          find decompiled -name "*.smali" -type f | while read file; do
            sed -i "s|L$ORIGINAL_PACKAGE/|Lcom/whatsapp/w4b/|g" "$file"
            sed -i "s|$ORIGINAL_PACKAGE|com.whatsapp.w4b|g" "$file"
          done
          
          # Update XML files
          find decompiled -name "*.xml" -type f | while read file; do
            sed -i "s|$ORIGINAL_PACKAGE|com.whatsapp.w4b|g" "$file"
          done
          
          # Update JSON files
          find decompiled -name "*.json" -type f | while read file; do
            sed -i "s|$ORIGINAL_PACKAGE|com.whatsapp.w4b|g" "$file" 2>/dev/null || true
          done
          
          echo "✓ All files updated"

      - name: Recompile APK
        id: recompile
        run: |
          apktool b decompiled -o unsigned.apk -f
          
          if [ -f "unsigned.apk" ] && [ -s "unsigned.apk" ]; then
            SIZE=$(ls -lh unsigned.apk | awk '{print $5}')
            echo "✅ Recompiled successfully! Size: $SIZE"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Recompile failed"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Create Keystore
        if: steps.recompile.outputs.status == 'success'
        run: |
          keytool -genkey -v \
            -keystore my-release-key.jks \
            -alias w4b \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass w4b123 \
            -keypass w4b123 \
            -dname "CN=WhatsApp W4B, OU=Dev, O=W4B, L=Dhaka, ST=Dhaka, C=BD" \
            -noprompt
          echo "✓ Keystore created"

      - name: Sign APK
        if: steps.recompile.outputs.status == 'success'
        run: |
          # Sign the APK
          jarsigner -verbose \
            -keystore my-release-key.jks \
            -storepass w4b123 \
            -keypass w4b123 \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            unsigned.apk w4b
          
          # Verify signature
          jarsigner -verify unsigned.apk
          
          # Copy to final name
          cp unsigned.apk com.whatsapp.w4b.apk
          echo "✓ APK signed successfully"

      - name: Verify Final APK
        if: steps.recompile.outputs.status == 'success'
        run: |
          echo "========================================="
          echo "FINAL VERIFICATION"
          echo "========================================="
          
          if [ -f "com.whatsapp.w4b.apk" ]; then
            SIZE=$(ls -lh com.whatsapp.w4b.apk | awk '{print $5}')
            echo "✅ APK: com.whatsapp.w4b.apk"
            echo "📦 Size: $SIZE"
            echo "📱 Package: com.whatsapp.w4b"
            
            # Quick check
            unzip -p com.whatsapp.w4b.apk AndroidManifest.xml | grep "package=" | head -1
          fi
          echo "========================================="

      - name: Create GitHub Release
        if: steps.recompile.outputs.status == 'success'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: whatsapp-w4b-v1.0.${{ github.run_number }}
          name: "WhatsApp W4B - v1.0.${{ github.run_number }}"
          body: |
            ## ✅ APK Successfully Modified and Signed!
            
            ### 📦 Package Information
            - **Original Package**: `${{ env.ORIGINAL_PACKAGE }}`
            - **New Package**: `com.whatsapp.w4b`
            - **Version**: v1.0.${{ github.run_number }}
            - **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            
            ### 🔧 Modifications Done
            - ✅ Package renamed everywhere
            - ✅ AndroidManifest.xml updated
            - ✅ All smali files updated
            - ✅ All XML resources updated
            - ✅ APK recompiled successfully
            - ✅ Signed with custom keystore
            
            ### 📥 Download
            [**Click here to download APK**](${{ github.server_url }}/${{ github.repository }}/releases/download/whatsapp-w4b-v1.0.${{ github.run_number }}/com.whatsapp.w4b.apk)
            
            ### 📱 Installation Instructions
            1. Download the APK file
            2. Go to Settings → Security → Enable "Unknown Sources"
            3. Install the APK
            
            ### ⚠️ Important Notes
            - This is a modified version of the original APK
            - Install at your own risk
            - Original app may need to be uninstalled first
            
            ### 📊 Build Stats
            - **Build Number**: ${{ github.run_number }}
            - **Runner**: ubuntu-latest
            - **APK Size**: $(ls -lh com.whatsapp.w4b.apk | awk '{print $5}')
          files: |
            com.whatsapp.w4b.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        if: steps.recompile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: w4b-signed-apk
          path: com.whatsapp.w4b.apk
          retention-days: 90

      - name: Download Link
        if: steps.recompile.outputs.status == 'success'
        run: |
          echo "========================================="
          echo "✅ SUCCESS! APK IS READY"
          echo "========================================="
          echo ""
          echo "🔗 DOWNLOAD FROM RELEASE:"
          echo "${{ github.server_url }}/${{ github.repository }}/releases/download/whatsapp-w4b-v1.0.${{ github.run_number }}/com.whatsapp.w4b.apk"
          echo ""
          echo "🔗 DOWNLOAD FROM ARTIFACT:"
          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "📱 Package: com.whatsapp.w4b"
          echo "========================================="
